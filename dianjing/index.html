<script>
'use strict';

const AB = window.ABCommon;
if (!AB) { document.body.insertAdjacentHTML('beforeend', '<p style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#000;padding:16px;border-radius:8px;z-index:99999">共享脚本未加载</p>'); }
const {
  fmtTime, findActiveSeg, normalizeChapters: ABNormalize, audioSrc: ABAudioSrc,
  applyHashRoute: ABHashRoute, updateHash: ABUpdateHash,
  updateMediaSession: ABUpdateMediaSession, updateMediaSessionPosition: ABUpdatePosition,
  showToast, announce
} = AB || {};
const SPEED_STEPS = (AB && AB.SPEED_STEPS) || [0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.5];
const BOOK_ID = 'dianjing';
const SPEED_KEY = 'audiobook-speed-' + BOOK_ID;

let CHAPTERS = [];
let currentIdx = 0;
let isPlaying = false;
let speedIdx = 0;
let segElements = [];
let autoPlayNext = true;
let userScrolling = false;
let scrollResumeTimer = null;
let lastActiveSegIdx = -1;
let sleepTimer = null; // 集成节赋值；章节结束处理需要
let virtualList = null; // 目录虚拟滚动实例

let isFirstRender = true;

const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const back15Btn = document.getElementById('back15Btn');
const fwd15Btn = document.getElementById('fwd15Btn');
const speedBtn = document.getElementById('speedBtn');
const themeBtn = document.getElementById('themeBtn');
const fontSizeBtn = document.getElementById('fontSizeBtn');
const menuBtn = document.getElementById('menuBtn');
const progressTrack = document.getElementById('progressTrack');
const progressFill = document.getElementById('progressFill');
const progressThumb = document.getElementById('progressThumb');
const progressTooltip = document.getElementById('progressTooltip');
const curTimeLabel = document.getElementById('curTime');
const durTimeLabel = document.getElementById('durTime');
const playerTitle = document.getElementById('playerTitle');
const topProgress = document.getElementById('topProgress');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

// ===== 主题（共享逻辑，存储键按书参数化） =====
AB.initTheme && AB.initTheme({
  key: 'dianjing_theme',
  button: themeBtn,
  iconFor: function () { return ''; }, /* 图标由 CSS 按 data-theme 切换（日/月 SVG） */
  onToggle: () => {
    themeBtn.classList.add('spinning');
    setTimeout(() => themeBtn.classList.remove('spinning'), 380);
  }
});

// ===== 阅读字号（共享逻辑，存储键按书参数化） =====
const readingCtrl = AB.initReadingSize && AB.initReadingSize({
  key: 'dianjing_reading_size',
  button: fontSizeBtn,
  apply: (size) => document.documentElement.style.setProperty('--reading-size', String(size))
});

// ===== 加载数据 =====
async function loadData() {
  try {
    const resp = await fetch('data.json');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const raw = await resp.json();
    CHAPTERS = ABNormalize ? ABNormalize(raw) : ((raw && raw.chapters) || raw || []);
    document.getElementById('initLoading').style.display = 'none';
    // >50 章走虚拟滚动：initVirtualList 会整块重建，跳过全量 buildTOC 省一次 DOM 构建
    if (CHAPTERS.length <= 50) buildTOC();
    initVirtualList();
    // 单一进度源决定起始章节（含旧键一次性迁移）
    const progress = AB && AB.loadProgress(BOOK_ID);
    let startIdx = progress && Number.isInteger(progress.chapterId) ? Number(progress.chapterId) : 0;
    currentIdx = Math.min(Math.max(startIdx, 0), CHAPTERS.length - 1);
    applyHashRoute();
    loadChapter(currentIdx, false);
    if (typeof checkResumeProgress === 'function') setTimeout(checkResumeProgress, 800);
    window.__dianjingStartCache && window.__dianjingStartCache();
  } catch(e) {
    document.getElementById('initLoading').innerHTML = AB.errorHTML('加载失败: ' + (e && e.message || e), 'retryLoadBtn');
    var retryBtn = document.getElementById('retryLoadBtn');
    if (retryBtn) retryBtn.addEventListener('click', function() {
      document.getElementById('initLoading').innerHTML = '<div class="skeleton sk-title"></div><div class="skeleton sk-line" style="width:97%"></div><div class="skeleton sk-line" style="width:92%"></div><div class="skeleton sk-line" style="width:96%"></div>';
      loadData();
    });
  }
}

// ===== 目录（普通列表 / 虚拟滚动 + 搜索） =====
let tocKeyword = '';
let tocSearchTimer = 0;
let tocBreakpointBound = false; // 断点监听只绑一次，重建虚拟列表时不叠加

function tocItemHeight() {
  // 移动端行高更大（padding 12px 20px + 0.9rem 字号）
  return window.matchMedia('(max-width: 768px)').matches ? 46 : 44;
}

function filterChapters(keyword) {
  const kw = String(keyword || '').trim().toLowerCase();
  if (!kw) return CHAPTERS;
  return CHAPTERS.filter((ch) => (ch.title || '').toLowerCase().includes(kw));
}

function buildTOC(keyword) {
  const toc = document.getElementById('toc');
  toc.innerHTML = '';
  const kw = String(keyword || '').trim().toLowerCase();
  const frag = document.createDocumentFragment();
  let count = 0;
  CHAPTERS.forEach((ch, i) => {
    if (kw && !(ch.title || '').toLowerCase().includes(kw)) return;
    count++;
    const a = document.createElement('a');
    a.dataset.idx = i;
    /* 目录入场 stagger：仅完整列表启用；搜索过滤时直出 */
    if (!kw) { a.style.animationDelay = Math.min(count - 1, 24) * 14 + 'ms'; } else { a.style.animation = 'none'; }
    a.setAttribute('role', 'button');
    a.tabIndex = 0;
    if (i === currentIdx) a.setAttribute('aria-current', 'true');
    const span = document.createElement('span');
    span.textContent = ch.title;
    const dur = document.createElement('span');
    dur.className = 'ch-dur';
    dur.textContent = fmtTime(ch.duration);
    a.appendChild(span);
    a.appendChild(dur);
    a.addEventListener('click', (e) => {
      e.preventDefault();
      loadChapter(i, isPlaying);
      closeSidebar();
    });
    a.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); a.click(); }
    });
    frag.appendChild(a);
  });
  toc.appendChild(frag);
  updateTOCActive();
}

function initVirtualList() {
  const tocContainer = document.getElementById('toc');
  if (virtualList || !tocContainer || CHAPTERS.length <= 50) return;
  // 章节对象 → 原始索引（O(1)；渲染每帧调用，避免 indexOf 的 O(n)）
  const chapterIndex = new WeakMap();
  CHAPTERS.forEach((ch, i) => chapterIndex.set(ch, i));
  virtualList = AB.createVirtualList(tocContainer, CHAPTERS, {
    itemHeight: tocItemHeight(),
    buffer: 8,
    threshold: 50,
    renderItem: function (ch, i) {
      const realIdx = chapterIndex.get(ch);
      const a = document.createElement('a');
      a.dataset.idx = realIdx;
      a.setAttribute('role', 'button');
      a.tabIndex = 0;
      if (realIdx === currentIdx) {
        a.classList.add('active');
        a.setAttribute('aria-current', 'true');
      }
      a.style.display = 'flex';
      a.style.justifyContent = 'space-between';
      a.style.alignItems = 'center';
      a.style.gap = '10px';
      a.style.padding = '9px 18px 9px 16px';
      a.style.color = 'var(--text-dim)';
      a.style.textDecoration = 'none';
      a.style.fontSize = '0.85rem';
      a.style.borderLeft = '3px solid transparent';
      a.style.borderRadius = '0 8px 8px 0';
      a.style.boxSizing = 'border-box';
      a.style.position = 'relative';

      const span = document.createElement('span');
      span.textContent = ch.title;
      span.style.flex = '1';
      span.style.minWidth = '0';
      span.style.overflow = 'hidden';
      span.style.textOverflow = 'ellipsis';
      span.style.whiteSpace = 'nowrap';

      const dur = document.createElement('span');
      dur.className = 'ch-dur';
      dur.textContent = fmtTime(ch.duration);
      dur.style.fontSize = '0.7rem';
      dur.style.opacity = '0.65';
      dur.style.fontVariantNumeric = 'tabular-nums';
      dur.style.flexShrink = '0';

      a.appendChild(span);
      a.appendChild(dur);
      return a;
    },
    onItemClick: function (ch) {
      loadChapter(chapterIndex.get(ch), isPlaying);
      closeSidebar();
    }
  });
  // 断点切换时重建行高（移动端行高更大）；监听器只注册一次
  if (!tocBreakpointBound) {
    tocBreakpointBound = true;
    window.matchMedia('(max-width: 768px)').addEventListener('change', function () {
      if (!virtualList) return;
      const kw = tocKeyword;
      virtualList.destroy();
      virtualList = null;
      initVirtualList();
      renderTOC(kw);
    });
  }
}

// 搜索 / 过滤统一入口：虚拟列表走 refresh 增量渲染，普通列表走 buildTOC
function renderTOC(keyword) {
  tocKeyword = String(keyword || '');
  const filtered = filterChapters(tocKeyword);
  const toc = document.getElementById('toc');
  const emptyEl = document.getElementById('tocEmpty');
  if (!filtered.length) {
    emptyEl.innerHTML = AB.emptyHTML('没有找到匹配章节', '清除搜索', 'clearSearchBtn');
    emptyEl.hidden = false;
    toc.hidden = true;
    const cb = document.getElementById('clearSearchBtn');
    if (cb) cb.addEventListener('click', function () {
      document.getElementById('tocSearch').value = '';
      renderTOC('');
    });
    return;
  }
  emptyEl.hidden = true;
  toc.hidden = false;
  if (virtualList) {
    virtualList.refresh(filtered);
    updateTOCActive();
  } else {
    buildTOC(tocKeyword);
  }
}

function updateTOCActive() {
  document.querySelectorAll('.sidebar a').forEach((a) => {
    const active = Number(a.dataset.idx) === currentIdx;
    a.classList.toggle('active', active);
    if (active) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
  });
}

document.getElementById('tocSearch').addEventListener('input', (e) => {

});

// ===== 侧边栏 =====
function openSidebar() {

  overlay.classList.add('show');
  overlay.setAttribute('aria-hidden', 'false');
  menuBtn.setAttribute('aria-expanded', 'true');

// ===== 章节渲染 =====
function loadChapter(idx, autoplay) {
  if (idx < 0 || idx >= CHAPTERS.length) return;
  currentIdx = idx;
  const ch = CHAPTERS[idx];
  const reader = document.getElementById('reader');

  // 使用 crossFade 过渡（首次加载直接渲染）
  const doRender = function () {
    reader.innerHTML = '';
    const titleEl = document.createElement('div');
    titleEl.className = 'chapter-title';
    titleEl.textContent = ch.title;
    reader.appendChild(titleEl);

    const contentEl = document.createElement('div');
    contentEl.className = 'chapter-content';
    segElements = [];
    const frag = document.createDocumentFragment();
    ch.segments.forEach((seg, si) => {
      const span = document.createElement('span');
      span.className = 'seg';
      span.dataset.idx = si;
      span.tabIndex = 0;
      span.setAttribute('role', 'button');
      span.textContent = seg.t;
      span.addEventListener('click', () => {
        if (audio.duration) {
          audio.currentTime = seg.s + 0.01;
          if (!isPlaying) { audio.play().catch(() => {}); }
          highlightSeg(si);
          span.classList.remove('flash');
          // 使用 animationend 清 class，避免强制重排
          span.addEventListener('animationend', function onEnd() { span.classList.remove('flash'); span.removeEventListener('animationend', onEnd); });
          span.classList.add('flash');
        }
      });
      span.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); span.click(); }
      });
      frag.appendChild(span);
      segElements.push(span);
    });
    contentEl.appendChild(frag);
    reader.appendChild(contentEl);
    userScrolling = false;
    clearTimeout(scrollResumeTimer);
    reader.scrollTop = 0;
    lastActiveSegIdx = -1;
    highlightSeg(0);
  };

  if (isFirstRender) { isFirstRender = false; doRender(); }
  else { AB.crossFade(reader, doRender); }

  // 更新播放器
  playerTitle.textContent = ch.title;
  audio.src = ABAudioSrc ? ABAudioSrc(ch) : ch.audio;
  audio.playbackRate = SPEED_STEPS[speedIdx];
  playBtn.disabled = false;
  prevBtn.disabled = (idx === 0);
  nextBtn.disabled = (idx === CHAPTERS.length - 1);

  // 更新顶部进度条（带动画）
  topProgress.style.width = '0';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const bookProgress = ((idx + 1) / CHAPTERS.length * 100).toFixed(1);
    topProgress.style.width = bookProgress + '%';
  }));

  // 更新目录高亮
  updateTOCActive();

  // 宽屏常驻目录：章节切换（含自动连播）时让当前章保持可见
  if (window.matchMedia('(min-width: 1024px)').matches) {
    if (virtualList && !tocKeyword) virtualList.scrollToIndex(idx);
    else {
      const active = document.querySelector('.sidebar a.active');
      if (active) active.scrollIntoView({ block: 'nearest' });
    }
  }

  updateMediaSession();
  updateHash();

  // 屏幕阅读器播报
  announce && announce('已加载第 ' + (idx + 1) + ' 章：' + ch.title);

  // 自动播放：等待音频就绪后再 play()，避免移动浏览器（iOS Safari / Chrome Android）
  // 在 src 改变后立即 play() 时因未加载完抛 NotAllowedError 被 catch 静默吞掉，
  // 导致章节末尾跳转后听不见声音。
  if (autoplay) tryPlayAfterReady();
}

/* 在 canplay / loadeddata 时再尝试播放；带过期保护避免事件链断裂。
 * 仅在自动连播时使用，避免打断用户手动暂停的意图。 */
function tryPlayAfterReady() {
  const a = audio;
  let done = false;
  const tryOnce = () => {
    if (done) return;
    done = true;
    a.removeEventListener('canplay', tryOnce);
    a.removeEventListener('loadeddata', tryOnce);
    a.play().catch(() => {
      /* 兜底：play() 被拒绝时（极少数浏览器的 autoplay 策略），提示用户手动点击 */
      showToast && showToast('请点击播放按钮继续收听');
    });
  };
  a.addEventListener('canplay', tryOnce);
  a.addEventListener('loadeddata', tryOnce);
  /* 兜底：若 canplay 始终未触发（SW 已缓存完整文件时可能不触发 loadeddata），
   * 最多等 1.2s 直接播放，避免用户感知"卡顿"或"跳章后无声"。 */
  setTimeout(() => { if (!done) tryOnce(); }, 1200);
}

// ===== 播放控制 =====
function togglePlay() {
  if (audio.paused) {
    audio.play().catch(() => {});
  } else {
    audio.pause();
  }
}

playBtn.addEventListener('click', togglePlay);

audio.addEventListener('play', () => {
  isPlaying = true;
  playBtn.classList.add('playing');
  playBtn.setAttribute('aria-label', '暂停');
});
audio.addEventListener('pause', () => {
  isPlaying = false;
  playBtn.classList.remove('playing');
  playBtn.setAttribute('aria-label', '播放');
});

audio.addEventListener('error', () => {
  /* 网络或解码失败：清晰提示用户，避免沉默。 */
  showToast && showToast('音频加载失败，请检查网络后重试', null, 'error');
  // 内联错误条
  var bar = document.querySelector('.player-bar');
  if (bar) {
    var existing = bar.querySelector('.ab-inline-error');
    if (existing) existing.remove();
    var errEl = document.createElement('div');
    errEl.className = 'ab-inline-error';
    errEl.textContent = '音频加载失败，请检查网络';
    errEl.setAttribute('role', 'alert');
    bar.appendChild(errEl);
    requestAnimationFrame(() => errEl.classList.add('show'));
    setTimeout(() => { errEl.classList.remove('show'); setTimeout(() => errEl.remove(), 300); }, 3000);
  }
});

// 自动连播核心：章节结束 → 播放下一章（「播完本章暂停」模式下让淡出接管）
audio.addEventListener('ended', () => {
  if (sleepTimer && sleepTimer.getMode() === 'chapter') {
    sleepTimer.onChapterEnded();
    return;
  }
  if (autoPlayNext && currentIdx < CHAPTERS.length - 1) {
    loadChapter(currentIdx + 1, true);
  }
});

audio.addEventListener('loadedmetadata', () => {
  durTimeLabel.textContent = fmtTime(audio.duration);
  progressTrack.setAttribute('aria-valuemax', String(Math.round(audio.duration)));
});

// 统一的 timeupdate 监听器：进度条 + 文本高亮 + 节流保存 + 锁屏位置同步
audio.addEventListener('timeupdate', () => {
  const cur = audio.currentTime;
  const dur = audio.duration;
  if (dur > 0) {
    const ratio = cur / dur;
    progressFill.style.width = (ratio * 100) + '%';
    progressThumb.style.left = (ratio * 100) + '%';
    // aria 数值统一用秒（与 loadedmetadata 的 valuemax 同单位）+ 人类可读文本
    progressTrack.setAttribute('aria-valuenow', String(Math.round(cur)));
    progressTrack.setAttribute('aria-valuetext', fmtTime(cur) + ' / ' + fmtTime(dur));
  }
  curTimeLabel.textContent = fmtTime(cur);

  // 文本高亮跟随（二分查找）
  const ch = CHAPTERS[currentIdx];
  if (ch && ch.segments) {
    const activeIdx = findActiveSeg(ch.segments, cur);
    if (activeIdx >= 0) highlightSeg(activeIdx);
  }

  // 节流保存（单一进度源，每 5s 一次）
  AB && AB.saveProgress(BOOK_ID, {
    chapterId: currentIdx,
    currentTime: cur,
    volume: audio.volume,
    playbackRate: audio.playbackRate
  });

  // 锁屏 / 系统媒体中心进度同步
  ABUpdatePosition && ABUpdatePosition(audio);
});

// 进度条拖拽
let isDragging = false;
function seekFromEvent(e) {
  const rect = progressTrack.getBoundingClientRect();
  const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
  const ratio = Math.max(0, Math.min(1, x / rect.width));
  if (audio.duration) {
    audio.currentTime = ratio * audio.duration;
    progressFill.style.width = (ratio * 100) + '%';
    progressThumb.style.left = (ratio * 100) + '%';
  }
}
progressTrack.addEventListener('mousedown', (e) => { isDragging = true; progressTrack.classList.add('is-dragging'); seekFromEvent(e); });
document.addEventListener('mousemove', (e) => { if (isDragging) seekFromEvent(e); });
document.addEventListener('mouseup', () => { isDragging = false; progressTrack.classList.remove('is-dragging'); });
progressTrack.addEventListener('touchstart', (e) => { isDragging = true; progressTrack.classList.add('is-dragging'); seekFromEvent(e); }, { passive: true });
progressTrack.addEventListener('touchmove', (e) => { if (isDragging) seekFromEvent(e); }, { passive: true });
progressTrack.addEventListener('touchend', () => { isDragging = false; progressTrack.classList.remove('is-dragging'); });

// 进度条悬停气泡
function showTooltip(e) {
  const rect = progressTrack.getBoundingClientRect();
  const dur = audio.duration;
  if (!dur) { progressTooltip.classList.remove('show'); return; }
  const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
  const ratio = Math.max(0, Math.min(1, x / rect.width));
  progressTooltip.style.left = (ratio * 100) + '%';
  progressTooltip.textContent = fmtTime(ratio * dur) + ' / ' + fmtTime(dur);
  progressTooltip.classList.add('show');
}
progressTrack.addEventListener('mousemove', showTooltip);
progressTrack.addEventListener('mouseleave', () => progressTooltip.classList.remove('show'));

// 键盘控制进度条
progressTrack.addEventListener('keydown', (e) => {
  if (!audio.duration) return;
  const delta = e.shiftKey ? 30 : 5;
  if (e.key === 'ArrowLeft') { e.preventDefault(); audio.currentTime = Math.max(0, audio.currentTime - delta); }
  if (e.key === 'ArrowRight') { e.preventDefault(); audio.currentTime = Math.min(audio.duration, audio.currentTime + delta); }
});

// 高亮段（仅更新变化的节点，避免每帧遍历整章，减少重绘/回流）
function highlightSeg(idx) {
  if (idx < 0 || idx >= segElements.length) return;
  if (idx === lastActiveSegIdx) return;
  const prev = segElements[lastActiveSegIdx];
  if (prev) { prev.classList.remove('active'); prev.removeAttribute('aria-current'); }
  const node = segElements[idx];
  node.classList.add('active');
  node.setAttribute('aria-current', 'true');
  lastActiveSegIdx = idx;
  // 播放中自动滚动跟随；用户手动滚动时暂停跟随
  if (!userScrolling) {
    const readerEl = document.getElementById('reader');
    const rect = node.getBoundingClientRect();
    const containerRect = readerEl.getBoundingClientRect();
    if (rect.top < containerRect.top + 80 || rect.bottom > containerRect.bottom - 80) {
      node.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

// 用户滚动检测：滑动时暂停跟随，停止 3 秒后恢复
(function() {
  const readerEl = document.getElementById('reader');
  if (!readerEl) return;
  const markScrolling = () => {
    userScrolling = true;
    clearTimeout(scrollResumeTimer);
    scrollResumeTimer = setTimeout(() => { userScrolling = false; }, 3000);
  };
  readerEl.addEventListener('touchmove', markScrolling, { passive: true });
  readerEl.addEventListener('wheel', markScrolling, { passive: true });
})();

// 上一章/下一章
prevBtn.addEventListener('click', () => {
  if (currentIdx > 0) loadChapter(currentIdx - 1, isPlaying);
});
nextBtn.addEventListener('click', () => {
  if (currentIdx < CHAPTERS.length - 1) loadChapter(currentIdx + 1, isPlaying);
});

// ±15 秒快退/快进（与键盘 J/K 同步长）
function seekBy(delta) {
  if (!audio.duration) return;
  audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + delta));
}
back15Btn.addEventListener('click', () => seekBy(-15));
fwd15Btn.addEventListener('click', () => seekBy(15));

// 倍速（8 档，与键盘快捷键共用 SPEED_STEPS，持久化；默认 1.0x）
(function initSpeed() {
  speedIdx = SPEED_STEPS.indexOf(1.0); // 默认 1.0x
  try {
    const saved = Number(localStorage.getItem(SPEED_KEY));
    const i = SPEED_STEPS.indexOf(saved);
    if (i >= 0) speedIdx = i;
  } catch (_) {}
  speedBtn.textContent = SPEED_STEPS[speedIdx].toFixed(2).replace(/\.?0+$/, '') + 'x';
})();
function applySpeed(rate, silent) {
  speedIdx = SPEED_STEPS.indexOf(rate);
  if (speedIdx < 0) { speedIdx = 2; rate = SPEED_STEPS[2]; }
  audio.playbackRate = rate;
  speedBtn.textContent = rate.toFixed(2).replace(/\.?0+$/, '') + 'x';
  try { localStorage.setItem(SPEED_KEY, String(rate)); } catch (_) {}
  if (!silent) announce && announce('播放速度 ' + speedBtn.textContent + ' 倍');
}
speedBtn.addEventListener('click', () => {
  applySpeed(SPEED_STEPS[(speedIdx + 1) % SPEED_STEPS.length]);
});

// 侧边栏
menuBtn.addEventListener('click', openSidebar);
overlay.addEventListener('click', closeSidebar);

// ===== 新增功能集成 =====
(function () {

    },
    onSleepTimer: function () {

    },

    });

    if (e.metaKey || e.ctrlKey || e.altKey) return;

  // --- 5. 播放进度持久化（统一格式；离开页面时绕过节流直写最新值）---
  // pagehide 与 visibilitychange=hidden 覆盖全部退出路径（含移动端杀页）；
  // 不挂 beforeunload——它会令页面失去 bfcache 资格，拖慢前进/后退恢复。
  function flushProgress() {
    if (CHAPTERS.length === 0) return;

      localStorage.setItem(
        'audiobook-progress-' + BOOK_ID,

})();

// ===== 继续播放提示（单一进度源；loadData 完成后调用） =====
function checkResumeProgress() {
  if (!CHAPTERS.length) return;
  const progress = AB.loadProgress(BOOK_ID);
  if (!progress || progress.chapterId == null) return;

  // 检查进度是否有效（章节在范围内，且时间大于 5 秒，小于章节时长）
  const chIdx = Number(progress.chapterId);
  const ch = CHAPTERS[chIdx];
  if (!ch || !progress.currentTime || progress.currentTime < 5) return;
  if (progress.currentTime >= ch.duration - 5) return;

  // 进度较新（7 天内）才提示
  const age = Date.now() - (progress.timestamp || 0);
  if (age > 7 * 24 * 60 * 60 * 1000) return;

  AB.showResumePrompt(progress, {
    chapterTitle: ch.title,
    onConfirm: function (p) {
      const idx = Number(p.chapterId);
      if (idx !== currentIdx) {
        loadChapter(idx, false);
      }
      // 等音频就绪后 seek
      const doSeek = function () {
        if (audio.duration && p.currentTime < audio.duration) {
          audio.currentTime = p.currentTime;
        }
        audio.play().catch(function () {});
        audio.removeEventListener('canplay', doSeek);
      };
      if (audio.readyState >= 1) doSeek();
      else audio.addEventListener('canplay', doSeek);

      // 恢复音量和速率（走 applySpeed 同步 speedIdx 与按钮文案，避免后续档位错乱）
      if (p.volume != null) audio.volume = p.volume;
      if (p.playbackRate != null) applySpeed(p.playbackRate, true);
    },
    onCancel: function () {
      // 「从头开始」真正归零：清除统一进度并回到本章起点
      AB.clearProgress(BOOK_ID);
      try { audio.currentTime = 0; } catch (_) {}
    }
  });
}

// ===== 离线缓存管理（SW 消息通道驱动：预取走 PREFETCH_AUDIO，统计走 QUERY_CACHED_AUDIO/CACHE_INFO） =====
(() => {

   * 注册 URL 带版本参数：sw.js 被 GitHub Pages 缓存 max-age=600（10 分钟），
   * 不带参数时用户在缓存窗口内刷新仍会命中旧 SW（例如音频 Range 转发缺陷的 v11）。
   * 版本化 scriptURL 会强制浏览器拉取指定版本，更新两步到位（与 sw.js 内 VERSION 同步递增；
   * 配合 common.js 的 controllerchange 自动刷新，旧 SW 用户一次访问即收敛到新版本）。 */
  AB.registerServiceWorker && AB.registerServiceWorker('sw.js?v=16');

  const cacheToggle = document.getElementById('cacheToggle');
  const cachePopup = document.getElementById('cachePopup');
  const cacheIcon = document.getElementById('cacheIcon');
  const cacheBadge = document.getElementById('cacheBadge');
  const cacheStatusText = document.getElementById('cacheStatusText');
  const cacheProgressBar = document.getElementById('cacheProgressBar');
  const cacheCountText = document.getElementById('cacheCountText');
  const cacheHint = document.getElementById('cacheHint');
  const cacheStartBtn = document.getElementById('cacheStartBtn');
  const cacheStopBtn = document.getElementById('cacheStopBtn');
  const cacheClearBtn = document.getElementById('cacheClearBtn');

  /* 默认开启持续缓存；用户点击"暂停"后设为 false 并持久化 */
  let autoCacheEnabled = (function () {
    try { const raw = localStorage.getItem('dianjing_auto_cache'); return raw == null ? true : raw !== 'false'; }
    catch (_) { return true; }
  })();

  let prefetching = false;
  let currentRunId = 0;
  let cachedCount = 0;
  let audioSize = 0;
  let audioLimit = 650 * 1024 * 1024; // 与 SW 默认上限一致；CACHE_INFO 会回传实际值
  let limitNotified = false;
  /* 数据未加载完成时，预缓存会被延迟到 loadData 成功后 */
  let dataReady = CHAPTERS.length > 0;

  function getAllAudioUrls() {
    return AB.audioUrls ? AB.audioUrls(CHAPTERS) : [];
  }

  function fmtMB(bytes) {
    return Math.round((bytes || 0) / 1024 / 1024) + 'MB';
  }

  /* 渲染 UI（cachedCount/audioSize/audioLimit 由 SW 消息回调更新） */
  function renderCacheUI() {
    if (!cacheToggle) return;
    const total = CHAPTERS.length;
    const pct = total > 0 ? (cachedCount / total * 100) : 0;
    if (cacheProgressBar) cacheProgressBar.style.width = pct.toFixed(1) + '%';
    if (cacheCountText) cacheCountText.textContent = cachedCount + ' / ' + total + ' 章';
    if (cacheBadge) {
      cacheBadge.textContent = cachedCount;
      cacheBadge.hidden = cachedCount === 0;
    }

    const online = navigator.onLine;
    if (cacheStatusText) {
      cacheStatusText.textContent = online ? '在线' : '离线';
      cacheStatusText.className = 'cache-status ' + (online ? 'online' : 'offline');
    }

    let hint = '有网络时自动缓存后续章节，断网也能听';
    if (total > 0 && cachedCount >= total) {
      hint = '全部章节已缓存，断网也能听';
      if (cacheStartBtn) { cacheStartBtn.disabled = true; cacheStartBtn.textContent = '已完成'; }
    } else if (!online) {
      hint = '当前离线，连接网络后可继续缓存';
      if (cacheStartBtn) cacheStartBtn.disabled = true;
    } else {
      if (cacheStartBtn) { cacheStartBtn.disabled = false; cacheStartBtn.textContent = autoCacheEnabled ? '继续缓存' : '开始缓存'; }
    }
    /* 容量上限提示（GET_CACHE_INFO 回传实际上限） */
    if (audioLimit && audioSize >= audioLimit * 0.95) {
      hint = '已达缓存上限 ' + fmtMB(audioLimit) + '，最久未听的章节会自动清理';
      if (!limitNotified) {
        limitNotified = true;
        showToast && showToast('音频缓存已达上限，将自动清理最旧章节');
      }
    }
    if (cacheHint) cacheHint.textContent = hint;

    if (cacheStopBtn) cacheStopBtn.hidden = !prefetching;
    if (cacheStartBtn) cacheStartBtn.hidden = prefetching || (total > 0 && cachedCount >= total);
    if (cacheToggle) cacheToggle.classList.toggle('active', prefetching);
    if (cacheIcon) cacheIcon.classList.toggle('prefetching', prefetching);
  }

  /* 向 SW 查询已缓存列表与容量统计（异步回传后重渲染） */
  function queryState() {
    AB.sendToServiceWorker && AB.sendToServiceWorker({ type: 'QUERY_CACHED_AUDIO' });
    AB.sendToServiceWorker && AB.sendToServiceWorker({ type: 'GET_CACHE_INFO' });
  }

  /* 开始预取：当前章节之后优先，走到末尾后再从头补齐；由 SW 下载并写入音频缓存 */
  function startPrefetch() {
    if (prefetching || !dataReady || CHAPTERS.length === 0) return;
    if (!navigator.onLine) { renderCacheUI(); return; }
    if (cachedCount >= CHAPTERS.length) { renderCacheUI(); return; }

    prefetching = true;
    const runId = ++currentRunId;
    renderCacheUI();

    const allUrls = getAllAudioUrls();
    const ordered = [...allUrls.slice(currentIdx), ...allUrls.slice(0, currentIdx)];
    AB.sendToServiceWorker && AB.sendToServiceWorker({ type: 'PREFETCH_AUDIO', urls: ordered, runId: runId });
  }

  /* 暂停：用户主动停止，并持久化状态 */
  function stopPrefetch() {
    autoCacheEnabled = false;
    try { localStorage.setItem('dianjing_auto_cache', 'false'); } catch (_) {}
    ++currentRunId;
    prefetching = false;
    AB.sendToServiceWorker && AB.sendToServiceWorker({ type: 'PREFETCH_STOP' });
    renderCacheUI();
    showToast && showToast('已暂停自动缓存，可随时继续');
  }

  /* 启用：用户主动开启，并持久化状态 */
  function startManual() {
    autoCacheEnabled = true;
    try { localStorage.setItem('dianjing_auto_cache', 'true'); } catch (_) {}
    startPrefetch();
  }

  /* 清除全部缓存（仅删音频缓存，外壳不受影响；由 SW 执行并广播） */
  function clearCache() {
    prefetching = false;
    AB.sendToServiceWorker && AB.sendToServiceWorker({ type: 'CLEAR_AUDIO_CACHE' });
    cachedCount = 0;
    renderCacheUI();
    showToast && showToast('已清除缓存');
  }

  /* 监听 SW 消息 */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', (e) => {
      const d = e.data || {};
      if (d.type === 'CACHED_AUDIO_LIST') {
        const urls = new Set(getAllAudioUrls());
        cachedCount = (d.urls || []).filter((u) => urls.has(u)).length;
        renderCacheUI();
      } else if (d.type === 'CACHE_INFO') {
        if (d.audioLimit) audioLimit = d.audioLimit;
        audioSize = d.audioSize || 0;
        renderCacheUI();
      } else if (d.type === 'PREFETCH_DONE') {
        if (d.runId != null && d.runId !== currentRunId) return; // 过期轮次
        prefetching = false;
        queryState();
        if (cachedCount >= CHAPTERS.length) showToast && showToast('全部章节已缓存');
      } else if (d.type === 'AUDIO_CACHE_CLEARED') {
        queryState();
      }
    });
  }

  /* 事件绑定 */
  if (cacheToggle) {
    cacheToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      cachePopup.classList.toggle('open');
      cacheToggle.setAttribute('aria-expanded', String(cachePopup.classList.contains('open')));
    });
  }
  if (cacheStartBtn) cacheStartBtn.addEventListener('click', startManual);
  if (cacheStopBtn) cacheStopBtn.addEventListener('click', stopPrefetch);
  if (cacheClearBtn) cacheClearBtn.addEventListener('click', clearCache);

  document.addEventListener('click', (e) => {
    if (cachePopup && cachePopup.classList.contains('open') && !e.target.closest('.cache-panel')) {
      cachePopup.classList.remove('open');
      if (cacheToggle) cacheToggle.setAttribute('aria-expanded', 'false');
    }
  });

  /* 网络状态变化时更新 UI；重新联网后自动从断点继续 */
  window.addEventListener('online', () => { queryState(); if (autoCacheEnabled) window.setTimeout(startPrefetch, 300); });
  window.addEventListener('offline', () => { renderCacheUI(); });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && navigator.onLine && autoCacheEnabled && !prefetching && dataReady) startPrefetch();
  });

  /* 申请持久化存储，避免移动端浏览器在空间紧张时优先清理音频缓存 */
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  /* 暴露给 loadData 调用：数据加载完成后启动持续缓存 */
  window.__dianjingStartCache = function () {
    dataReady = true;
    queryState();
    if (navigator.onLine && autoCacheEnabled) window.setTimeout(startPrefetch, 800);
  };
})();

// 初始化
loadData();
</script>

<script>
/* 交互动效增强：播放/暂停键弹跳反馈（附加监听，不影响主逻辑） */
(function () {
  'use strict';
  var audioEl = document.getElementById('audio');
  var pBtn = document.getElementById('playBtn');
  if (!audioEl || !pBtn) return;
  function pop() {
    pBtn.classList.remove('is-pop');
    pBtn.addEventListener('animationend', function onEnd() { pBtn.classList.remove('is-pop'); pBtn.removeEventListener('animationend', onEnd); });
    requestAnimationFrame(function() { pBtn.classList.add('is-pop'); });
  }
  audioEl.addEventListener('play', pop);
  audioEl.addEventListener('pause', pop);
})();
</script>
</body>
</html>
