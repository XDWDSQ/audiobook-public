<style>
:root {
  color-scheme: light;
  --bg: #f7f1e8;
  --surface: #fffaf4;
  --surface-light: #efe4d5;
  --text: #2f2923;
  --text-dim: #8b7d70;
  --accent: #b66b3f;
  --accent-deep: #8f4f2c;
  --accent-glow: rgba(182,107,63,0.12);
  --highlight: rgba(182,107,63,0.10);
  --gold: #c7954f;
  --border: #e5d8c9;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #211b18;
  --surface: #312721;
  --surface-light: #30241e;
  --text: #f3e9dd;
  --text-dim: #b4a294;
  --accent: #dc9968;
  --accent-deep: #f0b184;
  --accent-glow: rgba(220,153,104,0.16);
  --highlight: rgba(220,153,104,0.12);
  --gold: #d8ad68;
  --border: #55443a;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body {
  background:
    radial-gradient(circle at 10% 0%, rgba(199,149,79,.15), transparent 34rem),
    radial-gradient(circle at 100% 20%, rgba(182,107,63,.11), transparent 30rem),
    var(--bg);
  color: var(--text);
  font-family: "Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
  /* 定高 + 隐藏溢出：构成 app-shell 布局，正文在 .reader 内部滚动、播放栏常驻底部 */
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: background 0.3s, color 0.3s;
  -webkit-tap-highlight-color: transparent;
  contain: layout style;
}
header {
  text-align: center;
  padding: 16px 20px 14px;
  border-bottom: 1px solid var(--border);
  position: relative;
  flex-shrink: 0;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  max-width: 100%;
  text-decoration: none;
  color: var(--text);
}
.brand-mark {
  width: 38px; height: 38px; border-radius: 14px;
  display: grid; place-items: center;
  color: #fff8ef; background: linear-gradient(145deg, var(--accent), var(--gold));
  box-shadow: 0 8px 18px rgba(182,107,63,.24);
  font-family: "Noto Serif SC","Source Han Serif SC",serif; font-size: 19px;
  transition: transform .25s cubic-bezier(.22,.61,.36,1);
}
.brand:hover .brand-mark { transform: scale(1.06) rotate(-3deg); }
.brand-body { display: flex; flex-direction: column; line-height: 1.1; text-align: left; min-width: 0; }
.brand-title { font-size: 1.5rem; font-weight: 400; letter-spacing: 0.4em; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.18em; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-btns {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  gap: 8px;
}
.icon-btn {
  background: var(--surface-light);
  border: 1px solid var(--border);
  color: var(--text);
  width: 36px; height: 36px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  touch-action: manipulation;
}
.icon-btn:hover { background: var(--accent-glow); border-color: var(--accent); }
.menu-btn {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
}

/* 侧边目录 */
.sidebar {
  position: fixed;
  left: -320px;
  top: 0;
  width: 300px;
  height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  transition: left 0.3s ease;
  z-index: 200;
  padding: 20px 0;
  contain: layout style;
}
.sidebar.open { left: 0; }
.sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 150;
  display: none;
}
.sidebar-overlay.show { display: block; }
.sidebar h3 {
  font-size: 0.9rem;
  color: var(--accent);
  letter-spacing: 0.2em;
  padding: 0 20px 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}
.sidebar a {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 9px 18px 9px 16px;
  color: var(--text-dim);
  text-decoration: none;
  font-size: 0.85rem;
  transition: background 0.22s ease, color 0.22s ease, border-left-color 0.22s ease, padding-left 0.22s ease;
  border-left: 3px solid transparent;
  border-radius: 0 14px 14px 0;
  margin: 1px 0;
  position: relative;
  animation: ab-toc-in 0.5s ease both;
}
.sidebar a::before {
  content: "";
  position: absolute;
  left: 0; top: 6px; bottom: 6px;
  width: 3px;
  background: var(--accent);
  border-radius: 0 3px 3px 0;
  transform: scaleY(0);
  transform-origin: center;
  transition: transform 0.25s cubic-bezier(0.22, 0.61, 0.36, 1);
  pointer-events: none;
}
.sidebar a:hover {
  color: var(--text);
  background: var(--accent-glow);
  padding-left: 19px;
}
.sidebar a:hover::before {
  transform: scaleY(0.65);
}
.sidebar a.active {
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  border-left-color: var(--accent);
  font-weight: 600;
}
.sidebar a.active::before {
  transform: scaleY(1);
  box-shadow: 0 0 12px var(--accent);
}
.sidebar a .ch-dur {
  font-size: 0.7rem;
  color: var(--text-dim);
  opacity: 0.65;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
  transition: opacity 0.22s ease, color 0.22s ease;
}
.sidebar a:hover .ch-dur {
  opacity: 1;
  color: var(--accent);
}
@keyframes ab-toc-in {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}

/* 主内容区 */
.main-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.reader {
  flex: 1;
  overflow-y: auto;
  max-width: 680px;
  width: 100%;
  margin: 0 auto;
  padding: 32px 24px 40px;
  -webkit-overflow-scrolling: touch;
}
.chapter-title {
  font-size: 1.4rem;
  font-weight: 400;
  color: var(--accent);
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  letter-spacing: 0.05em;
}
.chapter-content {
  font-size: 1.05rem;
  line-height: 2;
  letter-spacing: 0.02em;
}
.seg {
  cursor: pointer;
  border-radius: 8px;
  transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
  padding: 1px 3px;
}
.seg:hover { background: var(--surface-light); color: var(--text); transform: translateY(-1px); }
.seg.active {
  background: var(--highlight);
  color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  transition: background .15s ease, box-shadow .25s ease, color .15s ease;
}
.seg.flash {
  animation: ab-seg-flash .7s ease;
}
@keyframes ab-seg-flash {
  0%   { background: var(--accent); color: #fff; box-shadow: 0 0 0 4px var(--accent); transform: scale(1.04); }
  100% { background: var(--highlight); color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); transform: scale(1); }
}

/* 底部播放栏 */
.player-bar {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.play-btn {
  background: var(--accent);
  border: none;
  color: var(--bg);
  width: 44px; height: 44px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.1rem;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  touch-action: manipulation;
}
.play-btn:hover { opacity: 0.85; }
.play-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.player-info {
  flex: 1;
  min-width: 0;
}
.player-title {
  font-size: 0.8rem;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}
.progress-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.time-label {
  font-size: 0.7rem;
  color: var(--text-dim);
  font-family: monospace;
  flex-shrink: 0;
  min-width: 36px;
  text-align: center;
}
.progress-track {
  flex: 1;
  height: 6px;
  background: var(--surface-light);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: height .22s ease;
}
.progress-track:hover { height: 9px; }
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, transparent));
  border-radius: 3px;
  width: 0%;
  transition: width 0.1s linear;
  position: relative;
}
.progress-track:hover .progress-fill { opacity: 0.95; }
.progress-tooltip {
  position: absolute;
  top: -22px;
  left: 0;
  transform: translateX(-50%);
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--bg);
  font-size: 0.65rem;
  font-family: monospace;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s ease;
}
.progress-tooltip.show { opacity: 1; }
.speed-btn, .font-size-btn {
  background: var(--surface-light);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 4px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.75rem;
  font-family: inherit;
  flex-shrink: 0;
  transition: all 0.2s;
  touch-action: manipulation;
}
.speed-btn:hover, .font-size-btn:hover { border-color: var(--accent); color: var(--accent); }
.font-size-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-glow); }

/* 导航按钮 */
.nav-btns {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.nav-btn {
  background: var(--surface-light);
  border: 1px solid var(--border);
  color: var(--text);
  width: 36px; height: 36px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.85rem;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  touch-action: manipulation;
}
.nav-btn:hover { background: var(--accent-glow); border-color: var(--accent); }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* 加载态 */
.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}
.loading p { animation: pulse 1.4s ease infinite; }
@keyframes pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
.loading .spinner {
  display: inline-block;
  width: 32px; height: 32px;
  border: 3px solid var(--surface-light);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 顶部进度条 */
.top-progress {
  position: fixed;
  top: 0; left: 0;
  height: 3px;
  background: var(--accent);
  z-index: 300;
  transition: width .55s cubic-bezier(.22,.61,.36,1);
}

/* 章节搜索 */
.sidebar-search {
  padding: 12px 20px 8px;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.sidebar-search input {
  width: 100%;
  background: var(--surface-light);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px 8px 32px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-family: inherit;
  outline: none;
  transition: border-color .15s;
}
.sidebar-search input:focus { border-color: var(--accent); }
.sidebar-search::before {
  content: "⌕";
  position: absolute;
  left: 32px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 0.95rem;
  pointer-events: none;
}

/* 阅读字号变量 */
.reader { font-size: calc(1rem * var(--reading-size, 1)); }
.reader .chapter-content { font-size: calc(1.05rem * var(--reading-size, 1)); }

/* 主题图标动效 */
#themeBtn { transition: transform .35s cubic-bezier(.22,.61,.36,1); }
#themeBtn.spinning { transform: rotate(180deg); }

/* 入场动画 */
@keyframes ab-fade-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
header, .reader, .player-bar { animation: ab-fade-up .55s ease both; }
header { animation-delay: .05s; }
.reader { animation-delay: .15s; }
.player-bar { animation-delay: .25s; }

/* 章节标题：带渐显 + 下划线扫过 */
.chapter-title {
  position: relative;
  animation: ab-title-in .55s cubic-bezier(.22,.61,.36,1) both;
}
.chapter-title::after {
  content: "";
  position: absolute;
  left: 0; bottom: -1px;
  width: 0; height: 1px;
  background: linear-gradient(90deg, var(--accent), transparent);
  animation: ab-underline .9s .25s cubic-bezier(.22,.61,.36,1) forwards;
}
@keyframes ab-title-in {
  from { opacity: 0; transform: translateY(8px); letter-spacing: .12em; }
  to { opacity: 1; transform: translateY(0); letter-spacing: .05em; }
}
@keyframes ab-underline { to { width: 56px; } }

/* 侧边栏切换图标动效 */
.menu-btn { transition: transform .35s cubic-bezier(.22,.61,.36,1), background .22s ease, border-color .22s ease; }
.menu-btn:hover { transform: rotate(90deg) translateY(0); }

/* icon-btn：统一提升 */
.icon-btn { transition: background .22s ease, border-color .22s ease, color .22s ease, transform .22s cubic-bezier(.22,.61,.36,1); }
.icon-btn:active { transform: scale(.9); }

/* 主题按钮：日/月图标随 data-theme 切换（纯 CSS，无 JS 文本替换） */
#themeBtn .icon-sun { display: block; }
#themeBtn .icon-moon { display: none; }
[data-theme="dark"] #themeBtn .icon-sun { display: none; }
[data-theme="dark"] #themeBtn .icon-moon { display: block; }

/* 缓存按钮：下载/旋转图标随预取状态切换 */
.cache-icon .icon-dl { display: block; }
.cache-icon .icon-sync { display: none; }
.cache-icon.prefetching .icon-dl { display: none; }
.cache-icon.prefetching .icon-sync { display: block; animation: spin 1.2s linear infinite; }

/* 播放按钮：状态切换（去掉无限脉冲，保留按压缩放） */
.play-btn { position: relative; transition: transform .2s cubic-bezier(.22,.61,.36,1), background .2s ease, box-shadow .2s ease; }
.play-btn .icon-play, .play-btn .icon-pause {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  transition: opacity .22s ease, transform .28s cubic-bezier(.22,.61,.36,1);
}
.play-btn .icon-pause { opacity: 0; transform: translate(-50%,-50%) scale(.5); }
.play-btn.playing .icon-play { opacity: 0; transform: translate(-50%,-50%) scale(.5); }
.play-btn.playing .icon-pause { opacity: 1; transform: translate(-50%,-50%) scale(1); }
.play-btn:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 30%, transparent); }
.play-btn:active:not(:disabled) { transform: scale(.96); }

/* speed-btn / font-size-btn：按下反馈 */
.speed-btn, .font-size-btn { transition: background .18s ease, border-color .18s ease, color .18s ease, transform .18s cubic-bezier(.22,.61,.36,1); }
.speed-btn:active, .font-size-btn:active { transform: scale(.92); }

/* nav-btn：章节翻页按钮 */
.nav-btn { transition: background .18s ease, border-color .18s ease, color .18s ease, transform .2s cubic-bezier(.22,.61,.36,1); }
.nav-btn:hover:not(:disabled) { transform: translateY(-1px); }
.nav-btn:active:not(:disabled) { transform: scale(.9); }
.nav-btn:disabled { opacity: .25; }

@media (max-width: 768px) {
  header { padding: 14px 16px 12px; }
  /* 四字长书名在窄屏收缩省略，不与左右两侧悬浮按钮重叠：
     预留左菜单(36+16) + 右按钮 3×36+2×8+16 + 间隙 */
  .brand { max-width: calc(100% - 224px); }
  .brand-title { font-size: 1.3rem; }
  .brand-mark { width: 34px; height: 34px; font-size: 17px; }
  .menu-btn { left: 12px; }
  .header-btns { right: 12px; }
  .reader { padding: 20px 16px 30px; }
  .chapter-title { font-size: 1.2rem; }

}
@media (max-width: 480px) {
  /* 预留左菜单(40+12) + 右按钮 3×40+2×8+12（含安装按钮）+ 间隙；字距收紧让四字标题尽量完整显示 */
  .brand { max-width: calc(100% - 208px); }
  .brand-title { font-size: 1.05rem; letter-spacing: 0.18em; }
  .brand-sub { font-size: 0.65rem; }
  .brand-mark { width: 32px; height: 32px; font-size: 16px; }
  .icon-btn { width: 34px; height: 34px; font-size: 0.9rem; }

/* 触摸设备优化 */
@media (hover: none) and (pointer: coarse) {
  .icon-btn:hover, .nav-btn:hover, .speed-btn:hover, .font-size-btn:hover {
    background: var(--surface-light); border-color: var(--border); color: var(--text);
  }
  .icon-btn:active, .nav-btn:active { transform: scale(0.92); }
  .sidebar a:hover { background: transparent; border-left-color: transparent; padding-left: 16px; }
  .sidebar a:hover::before { transform: scaleY(0); }
  .sidebar a:active { background: var(--surface-light); }
  /* 触屏禁用菜单按钮 90° 旋转 + 标题下划线扫过，节电 */
  .menu-btn:hover { transform: none; }
  .chapter-title::after { animation: none; width: 56px; }
  .progress-track:hover { height: 6px; }
}

/* 离线缓存浮动面板（持续自动缓存） */
.cache-panel {
  position: fixed; z-index: 25; right: 16px; bottom: 100px;
}
.cache-toggle {
  width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--surface-light);
  color: var(--text-dim); cursor: pointer;
  display: grid; place-items: center; font-size: 18px; position: relative;
  box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  transition: all .2s;
}
.cache-toggle:hover { border-color: var(--accent); color: var(--accent); }
.cache-toggle.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.cache-badge {
  position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px;
  border-radius: 9px; background: var(--accent); color: var(--bg);
  font-size: 10px; font-weight: 700;
  display: grid; place-items: center; padding: 0 4px;
}
/* display:grid 会压过 hidden 属性的 UA 样式，必须显式关闭，否则徽标「0」常驻盖住正文 */
.cache-badge[hidden] { display: none; }
.cache-popup {
  display: none; position: absolute; right: 0; bottom: 52px;
  width: 280px; padding: 16px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--surface);
  box-shadow: 0 12px 40px rgba(0,0,0,0.28);
}
.cache-popup.open { display: block; }
.cache-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.cache-title { font-size: 14px; font-weight: 700; color: var(--accent); }
.cache-status { font-size: 11px; color: var(--text-dim); }
.cache-status.online { color: #2f7d4a; }
.cache-status.offline { color: var(--accent); }
.cache-progress-wrap { margin-bottom: 8px; }
.cache-progress { height: 6px; border-radius: 99px; background: var(--surface-light); overflow: hidden; }
.cache-progress > span {
  display: block; height: 100%; width: 0; border-radius: inherit;
  background: var(--accent); transition: width .3s;
}
.cache-count { display: block; margin-top: 5px; font-size: 11px; color: var(--text-dim); text-align: right; }
.cache-hint { margin: 0 0 12px; font-size: 11px; color: var(--text-dim); line-height: 1.5; }
.cache-actions { display: flex; gap: 8px; }
.cache-btn {
  flex: 1; padding: 8px 0; border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface-light); color: var(--text); cursor: pointer;
  font-size: 12px; font-family: inherit;
  transition: all .15s;
}
.cache-btn:hover { border-color: var(--accent); color: var(--accent); }
.cache-btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.cache-btn.primary:hover { opacity: 0.85; }
.cache-btn:disabled { opacity: .45; cursor: not-allowed; }
/* 移动端：避让底部播放器，移到导航条下方 */
@media (max-width: 480px) {
  .cache-panel { right: 12px; bottom: 130px; }
  .cache-toggle { width: 40px; height: 40px; }
  .cache-popup { width: calc(100vw - 24px); max-width: 320px; }
}

/* 安全区域适配（刘海屏/底部横条） */
@supports (padding-bottom: env(safe-area-inset-bottom)) {
  header { padding-top: calc(16px + env(safe-area-inset-top)); }
  .player-bar { padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
  /* 抽屉目录同样避开顶部刘海（独立于 header 的定位层） */
  .sidebar { padding-top: calc(20px + env(safe-area-inset-top)); }
}

/* 高对比度模式 */
@media (prefers-contrast: more) {
  .seg.active { box-shadow: 0 0 0 2px var(--accent); }
  .icon-btn, .nav-btn, .speed-btn, .font-size-btn { border-width: 2px; }
}

/* ===== 交互动效升级 ===== */
/* 章节内容入场（节点随章节切换重建，动画自动重放） */
.chapter-content { animation: ab-content-in .5s cubic-bezier(.22,.61,.36,1) both; }
@keyframes ab-content-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* 骨架屏加载（替代 spinner） */
.skeleton-wrap { padding: 4px 0; }
.skeleton { position: relative; overflow: hidden; background: var(--surface-light); border-radius: 10px; }
.skeleton::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--text) 9%, transparent), transparent);
  transform: translateX(-100%);
  animation: ab-sk 1.4s ease-in-out infinite;
}
@keyframes ab-sk { 60% { transform: translateX(100%); } 100% { transform: translateX(100%); } }
.sk-title { width: 44%; height: 26px; margin-bottom: 30px; }
.sk-line { height: 15px; margin-bottom: 20px; }

/* 侧栏遮罩淡入淡出 */
.sidebar-overlay { display: block; opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility 0s linear .32s; }
.sidebar-overlay.show { opacity: 1; visibility: visible; transition: opacity .3s ease; }

/* 侧栏滑动缓动升级 */
.sidebar { transition: left .38s cubic-bezier(.22,.61,.36,1); }

/* 目录条目：打开侧栏时才播 stagger（配合 JS 逐项 delay） */
.sidebar a { animation: none; }
.sidebar.open a { animation: ab-toc-in .45s cubic-bezier(.22,.61,.36,1) both; }

/* 进度条拇指：悬停/拖拽时浮现 */
.progress-thumb {
  position: absolute; top: 50%; left: 0; z-index: 2;
  width: 13px; height: 13px; border-radius: 50%;
  background: var(--accent); border: 2.5px solid var(--surface);
  box-shadow: 0 1px 5px rgba(0,0,0,.35);
  transform: translate(-50%,-50%) scale(0);
  transition: transform .18s cubic-bezier(.22,.61,.36,1);
  pointer-events: none;
}
.progress-track:hover .progress-thumb,
.progress-track.is-dragging .progress-thumb { transform: translate(-50%,-50%) scale(1); }

/* 播放键状态切换弹跳 */
.play-btn.is-pop { animation: ab-pop .3s cubic-bezier(.22,.61,.36,1); }
@keyframes ab-pop { 0% { transform: scale(.84); } 60% { transform: scale(1.07); } 100% { transform: scale(1); } }

/* 缓存弹层：弹入 */
.cache-popup {
  display: block; opacity: 0; visibility: hidden;
  transform: translateY(10px) scale(.97); transform-origin: bottom right;
  transition: opacity .24s ease, transform .3s cubic-bezier(.22,.61,.36,1), visibility 0s linear .3s;
}
.cache-popup.open { opacity: 1; visibility: visible; transform: none; transition: opacity .24s ease, transform .3s cubic-bezier(.22,.61,.36,1); }

/* 减少动态偏好：新增动画直出 */
@media (prefers-reduced-motion: reduce) {
  .chapter-content, .sidebar.open a, .skeleton::after { animation: none !important; }
  .play-btn .icon-play, .play-btn .icon-pause { transition: none !important; }
}

/* 宽屏常驻目录：≥1024px 时目录固定在左侧（吸收 nanian 版经验），不再用抽屉 */
@media (min-width: 1024px) {
  body {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    height: 100vh;
    height: 100dvh;
  }
  header { grid-column: 1 / -1; grid-row: 1; }
  .menu-btn { display: none; }
  .sidebar-overlay { display: none !important; }
  .sidebar {
    grid-column: 1; grid-row: 2;
    position: static;
    left: auto; top: auto;
    width: auto; height: auto;
    min-height: 0;
    padding: 12px 0 20px;
    border-top: none;
    transition: none;
    z-index: auto;
  }
  /* 打开/关闭类不再影响布局（无遮罩、无动画） */
  .sidebar.open a { animation: none; }
  .main-wrap { grid-column: 2; grid-row: 2; min-height: 0; }
  .reader { padding: 36px 40px 48px; }
}

/* 进度跳转按钮（桌面显示；移动端靠进度条拖拽与长按） */
.skip-btn {
  background: var(--surface-light);
  border: 1px solid var(--border);
  color: var(--text);
  width: 36px; height: 36px;
  border-radius: 8px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background .18s ease, border-color .18s ease, transform .18s cubic-bezier(.22,.61,.36,1);
  touch-action: manipulation;
}
.skip-btn:hover { background: var(--accent-glow); border-color: var(--accent); }
.skip-btn:active { transform: scale(.9); }
@media (max-width: 767px) { .skip-btn { display: none; } }

/* 图标按钮：SVG 图标统一尺寸 */
.icon-btn svg, .nav-btn svg, .skip-btn svg { display: block; }

/* 内联错误条（播放器上方） */
.player-bar { position: relative; }

/* ===== 移动端体验补强（触控目标 / 进度条命中区 / 横屏 / 输入缩放） ===== */
/* iOS Safari：输入框字号 ≥16px，聚焦时不触发页面自动缩放 */
@media (max-width: 768px) {

}
/* 触屏：进度条命中区加高到 24px（视觉细条不变，整条可点可拖） */
@media (hover: none) and (pointer: coarse) {

  .progress-track::before {

  .progress-thumb { top: 12px; }
}
/* 小屏：控件触控目标提升到 ≥40px */
@media (max-width: 480px) {
  .icon-btn { width: 40px; height: 40px; }
  .player-bar { row-gap: 2px; }

}
/* 手机横屏：压缩头部与留白，把高度留给正文 */
@media (orientation: landscape) and (max-height: 500px) {

}

'use strict';

const AB = window.ABCommon;
if (!AB) { document.body.insertAdjacentHTML('beforeend', '<p style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#000;padding:16px;border-radius:8px;z-index:99999">共享脚本未加载</p>'); }
const {
  fmtTime, findActiveSeg, normalizeChapters: ABNormalize, audioSrc: ABAudioSrc,
  applyHashRoute: ABHashRoute, updateHash: ABUpdateHash,
  updateMediaSession: ABUpdateMediaSession, updateMediaSessionPosition: ABUpdatePosition,
  showToast, announce
} = AB || {};
const SPEED_STEPS = (AB && AB.SPEED_STEPS) || [0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.5];
const BOOK_ID = 'dianjing';
const SPEED_KEY = 'audiobook-speed-' + BOOK_ID;

let CHAPTERS = [];
let currentIdx = 0;
let isPlaying = false;
let speedIdx = 0;
let segElements = [];
let autoPlayNext = true;
let userScrolling = false;
let scrollResumeTimer = null;
let lastActiveSegIdx = -1;
let sleepTimer = null; // 集成节赋值；章节结束处理需要
let virtualList = null; // 目录虚拟滚动实例

let isFirstRender = true;

const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const back15Btn = document.getElementById('back15Btn');
const fwd15Btn = document.getElementById('fwd15Btn');
const speedBtn = document.getElementById('speedBtn');
const themeBtn = document.getElementById('themeBtn');
const fontSizeBtn = document.getElementById('fontSizeBtn');
const menuBtn = document.getElementById('menuBtn');
const progressTrack = document.getElementById('progressTrack');
const progressFill = document.getElementById('progressFill');
const progressThumb = document.getElementById('progressThumb');
const progressTooltip = document.getElementById('progressTooltip');
const curTimeLabel = document.getElementById('curTime');
const durTimeLabel = document.getElementById('durTime');
const playerTitle = document.getElementById('playerTitle');
const topProgress = document.getElementById('topProgress');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

// ===== 主题（共享逻辑，存储键按书参数化） =====
AB.initTheme && AB.initTheme({
  key: 'dianjing_theme',
  button: themeBtn,
  iconFor: function () { return ''; }, /* 图标由 CSS 按 data-theme 切换（日/月 SVG） */
  onToggle: () => {
    themeBtn.classList.add('spinning');
    setTimeout(() => themeBtn.classList.remove('spinning'), 380);
  }
});

// ===== 阅读字号（共享逻辑，存储键按书参数化） =====
const readingCtrl = AB.initReadingSize && AB.initReadingSize({
  key: 'dianjing_reading_size',
  button: fontSizeBtn,
  apply: (size) => document.documentElement.style.setProperty('--reading-size', String(size))
});

// ===== 加载数据 =====
async function loadData() {
  try {
    const resp = await fetch('data.json');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const raw = await resp.json();
    CHAPTERS = ABNormalize ? ABNormalize(raw) : ((raw && raw.chapters) || raw || []);
    document.getElementById('initLoading').style.display = 'none';
    buildTOC();
    initVirtualList();
    // 单一进度源决定起始章节（含旧键一次性迁移）
    const progress = AB && AB.loadProgress(BOOK_ID);
    let startIdx = progress && Number.isInteger(progress.chapterId) ? Number(progress.chapterId) : 0;
    currentIdx = Math.min(Math.max(startIdx, 0), CHAPTERS.length - 1);
    applyHashRoute();
    loadChapter(currentIdx, false);
    if (typeof checkResumeProgress === 'function') setTimeout(checkResumeProgress, 800);
    window.__dianjingStartCache && window.__dianjingStartCache();
  } catch(e) {
    document.getElementById('initLoading').innerHTML = AB.errorHTML('加载失败: ' + (e && e.message || e), 'retryLoadBtn');
    var retryBtn = document.getElementById('retryLoadBtn');
    if (retryBtn) retryBtn.addEventListener('click', function() {
      document.getElementById('initLoading').innerHTML = '<div class="skeleton sk-title"></div><div class="skeleton sk-line" style="width:97%"></div><div class="skeleton sk-line" style="width:92%"></div><div class="skeleton sk-line" style="width:96%"></div>';
      loadData();
    });
  }
}

// ===== 目录（普通列表 / 虚拟滚动 + 搜索） =====
let tocKeyword = '';
let tocSearchTimer = 0;
let tocBreakpointBound = false; // 断点监听只绑一次，重建虚拟列表时不叠加

function tocItemHeight() {
  // 移动端行高更大（padding 12px 20px + 0.9rem 字号）
  return window.matchMedia('(max-width: 768px)').matches ? 46 : 44;
}

function filterChapters(keyword) {
  const kw = String(keyword || '').trim().toLowerCase();
  if (!kw) return CHAPTERS;
  return CHAPTERS.filter((ch) => (ch.title || '').toLowerCase().includes(kw));
}

function buildTOC(keyword) {
  const toc = document.getElementById('toc');
  toc.innerHTML = '';
  const kw = String(keyword || '').trim().toLowerCase();
  const frag = document.createDocumentFragment();
  let count = 0;
  CHAPTERS.forEach((ch, i) => {
    if (kw && !(ch.title || '').toLowerCase().includes(kw)) return;
    count++;
    const a = document.createElement('a');
    a.dataset.idx = i;
    /* 目录入场 stagger：仅完整列表启用；搜索过滤时直出 */
    if (!kw) { a.style.animationDelay = Math.min(count - 1, 24) * 14 + 'ms'; } else { a.style.animation = 'none'; }
    a.setAttribute('role', 'button');
    a.tabIndex = 0;
    if (i === currentIdx) a.setAttribute('aria-current', 'true');
    const span = document.createElement('span');
    span.textContent = ch.title;
    const dur = document.createElement('span');
    dur.className = 'ch-dur';
    dur.textContent = fmtTime(ch.duration);
    a.appendChild(span);
    a.appendChild(dur);
    a.addEventListener('click', (e) => {
      e.preventDefault();
      loadChapter(i, isPlaying);
      closeSidebar();
    });
    a.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); a.click(); }
    });
    frag.appendChild(a);
  });
  toc.appendChild(frag);
  updateTOCActive();
}

function initVirtualList() {
  const tocContainer = document.getElementById('toc');
  if (virtualList || !tocContainer || CHAPTERS.length <= 50) return;
  virtualList = AB.createVirtualList(tocContainer, CHAPTERS, {
    itemHeight: tocItemHeight(),
    buffer: 8,
    threshold: 50,
    renderItem: function (ch, i) {
      const realIdx = CHAPTERS.indexOf(ch);
      const a = document.createElement('a');
      a.dataset.idx = realIdx;
      a.setAttribute('role', 'button');
      a.tabIndex = 0;
      if (realIdx === currentIdx) {
        a.classList.add('active');
        a.setAttribute('aria-current', 'true');
      }
      a.style.display = 'flex';
      a.style.justifyContent = 'space-between';
      a.style.alignItems = 'center';
      a.style.gap = '10px';
      a.style.padding = '9px 18px 9px 16px';
      a.style.color = 'var(--text-dim)';
      a.style.textDecoration = 'none';
      a.style.fontSize = '0.85rem';
      a.style.borderLeft = '3px solid transparent';
      a.style.borderRadius = '0 8px 8px 0';
      a.style.boxSizing = 'border-box';
      a.style.position = 'relative';

      const span = document.createElement('span');
      span.textContent = ch.title;
      span.style.flex = '1';
      span.style.minWidth = '0';
      span.style.overflow = 'hidden';
      span.style.textOverflow = 'ellipsis';
      span.style.whiteSpace = 'nowrap';

      const dur = document.createElement('span');
      dur.className = 'ch-dur';
      dur.textContent = fmtTime(ch.duration);
      dur.style.fontSize = '0.7rem';
      dur.style.opacity = '0.65';
      dur.style.fontVariantNumeric = 'tabular-nums';
      dur.style.flexShrink = '0';

      a.appendChild(span);
      a.appendChild(dur);
      return a;
    },
    onItemClick: function (ch) {
      loadChapter(CHAPTERS.indexOf(ch), isPlaying);
      closeSidebar();
    }
  });
  // 断点切换时重建行高（移动端行高更大）；监听器只注册一次
  if (!tocBreakpointBound) {
    tocBreakpointBound = true;
    window.matchMedia('(max-width: 768px)').addEventListener('change', function () {
      if (!virtualList) return;
      const kw = tocKeyword;
      virtualList.destroy();
      virtualList = null;
      initVirtualList();
      renderTOC(kw);
    });
  }
}

// 搜索 / 过滤统一入口：虚拟列表走 refresh 增量渲染，普通列表走 buildTOC
function renderTOC(keyword) {
  tocKeyword = String(keyword || '');
  const filtered = filterChapters(tocKeyword);
  const toc = document.getElementById('toc');
  const emptyEl = document.getElementById('tocEmpty');
  if (!filtered.length) {
    emptyEl.innerHTML = AB.emptyHTML('没有找到匹配章节', '清除搜索', 'clearSearchBtn');
    emptyEl.hidden = false;
    toc.hidden = true;
    const cb = document.getElementById('clearSearchBtn');
    if (cb) cb.addEventListener('click', function () {
      document.getElementById('tocSearch').value = '';
      renderTOC('');
    });
    return;
  }
  emptyEl.hidden = true;
  toc.hidden = false;
  if (virtualList) {
    virtualList.refresh(filtered);
    updateTOCActive();
  } else {
    buildTOC(tocKeyword);
  }
}

function updateTOCActive() {
  document.querySelectorAll('.sidebar a').forEach((a) => {
    const active = Number(a.dataset.idx) === currentIdx;
    a.classList.toggle('active', active);
    if (active) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
  });
}

document.getElementById('tocSearch').addEventListener('input', (e) => {
  clearTimeout(tocSearchTimer);
  tocSearchTimer = setTimeout(() => renderTOC(e.target.value), 200);
});

// ===== 侧边栏 =====
function openSidebar() {
  sidebar.classList.add('open');
  overlay.classList.add('show');
  overlay.setAttribute('aria-hidden', 'false');
  menuBtn.setAttribute('aria-expanded', 'true');
  AB.trapFocus(sidebar, menuBtn);
  setTimeout(function () {
    if (virtualList && !tocKeyword) virtualList.scrollToIndex(currentIdx);
  }, 350);
}
function closeSidebar() {
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
  overlay.setAttribute('aria-hidden', 'true');
  menuBtn.setAttribute('aria-expanded', 'false');
  AB.releaseFocus();
}

// ===== 章节渲染 =====
function loadChapter(idx, autoplay) {
  if (idx < 0 || idx >= CHAPTERS.length) return;
  currentIdx = idx;
  const ch = CHAPTERS[idx];
  const reader = document.getElementById('reader');

  // 使用 crossFade 过渡（首次加载直接渲染）
  const doRender = function () {
    reader.innerHTML = '';
    const titleEl = document.createElement('div');
    titleEl.className = 'chapter-title';
    titleEl.textContent = ch.title;
    reader.appendChild(titleEl);

    const contentEl = document.createElement('div');
    contentEl.className = 'chapter-content';
    segElements = [];
    const frag = document.createDocumentFragment();
    ch.segments.forEach((seg, si) => {
      const span = document.createElement('span');
      span.className = 'seg';
      span.dataset.idx = si;
      span.tabIndex = 0;
      span.setAttribute('role', 'button');
      span.textContent = seg.t;
      span.addEventListener('click', () => {
        if (audio.duration) {
          audio.currentTime = seg.s + 0.01;
          if (!isPlaying) { audio.play().catch(() => {}); }
          highlightSeg(si);
          span.classList.remove('flash');
          // 使用 animationend 清 class，避免强制重排
          span.addEventListener('animationend', function onEnd() { span.classList.remove('flash'); span.removeEventListener('animationend', onEnd); });
          span.classList.add('flash');
        }
      });
      span.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); span.click(); }
      });
      frag.appendChild(span);
      segElements.push(span);
    });
    contentEl.appendChild(frag);
    reader.appendChild(contentEl);
    userScrolling = false;
    clearTimeout(scrollResumeTimer);
    reader.scrollTop = 0;
    lastActiveSegIdx = -1;
    highlightSeg(0);
  };

  if (isFirstRender) { isFirstRender = false; doRender(); }
  else { AB.crossFade(reader, doRender); }

  // 更新播放器
  playerTitle.textContent = ch.title;
  audio.src = ABAudioSrc ? ABAudioSrc(ch) : ch.audio;
  audio.playbackRate = SPEED_STEPS[speedIdx];
  playBtn.disabled = false;
  prevBtn.disabled = (idx === 0);
  nextBtn.disabled = (idx === CHAPTERS.length - 1);

  // 更新顶部进度条（带动画）
  topProgress.style.width = '0';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const bookProgress = ((idx + 1) / CHAPTERS.length * 100).toFixed(1);
    topProgress.style.width = bookProgress + '%';
  }));

  // 更新目录高亮
  updateTOCActive();

  updateMediaSession();
  updateHash();

  // 屏幕阅读器播报
  announce && announce('已加载第 ' + (idx + 1) + ' 章：' + ch.title);

  // 自动播放：等待音频就绪后再 play()，避免移动浏览器（iOS Safari / Chrome Android）
  // 在 src 改变后立即 play() 时因未加载完抛 NotAllowedError 被 catch 静默吞掉，
  // 导致章节末尾跳转后听不见声音。
  if (autoplay) tryPlayAfterReady();
}

/* 在 canplay / loadeddata 时再尝试播放；带过期保护避免事件链断裂。
 * 仅在自动连播时使用，避免打断用户手动暂停的意图。 */
function tryPlayAfterReady() {
  const a = audio;
  let done = false;
  const tryOnce = () => {
    if (done) return;
    done = true;
    a.removeEventListener('canplay', tryOnce);
    a.removeEventListener('loadeddata', tryOnce);
    a.play().catch(() => {
      /* 兜底：play() 被拒绝时（极少数浏览器的 autoplay 策略），提示用户手动点击 */
      showToast && showToast('请点击播放按钮继续收听');
    });
  };
  a.addEventListener('canplay', tryOnce);
  a.addEventListener('loadeddata', tryOnce);
  /* 兜底：若 canplay 始终未触发（SW 已缓存完整文件时可能不触发 loadeddata），
   * 最多等 1.2s 直接播放，避免用户感知"卡顿"或"跳章后无声"。 */
  setTimeout(() => { if (!done) tryOnce(); }, 1200);
}

// ===== 播放控制 =====
function togglePlay() {
  if (audio.paused) {
    audio.play().catch(() => {});
  } else {
    audio.pause();
  }
}

playBtn.addEventListener('click', togglePlay);

audio.addEventListener('play', () => {
  isPlaying = true;
  playBtn.classList.add('playing');
  playBtn.setAttribute('aria-label', '暂停');
});
audio.addEventListener('pause', () => {
  isPlaying = false;
  playBtn.classList.remove('playing');
  playBtn.setAttribute('aria-label', '播放');
});

audio.addEventListener('error', () => {
  /* 网络或解码失败：清晰提示用户，避免沉默。 */
  showToast && showToast('音频加载失败，请检查网络后重试', null, 'error');
  // 内联错误条
  var bar = document.querySelector('.player-bar');
  if (bar) {
    var existing = bar.querySelector('.ab-inline-error');
    if (existing) existing.remove();
    var errEl = document.createElement('div');
    errEl.className = 'ab-inline-error';
    errEl.textContent = '音频加载失败，请检查网络';
    errEl.setAttribute('role', 'alert');
    bar.appendChild(errEl);
    requestAnimationFrame(() => errEl.classList.add('show'));
    setTimeout(() => { errEl.classList.remove('show'); setTimeout(() => errEl.remove(), 300); }, 3000);
  }
});

// 自动连播核心：章节结束 → 播放下一章（「播完本章暂停」模式下让淡出接管）
audio.addEventListener('ended', () => {
  if (sleepTimer && sleepTimer.getMode() === 'chapter') {
    sleepTimer.onChapterEnded();
    return;
  }
  if (autoPlayNext && currentIdx < CHAPTERS.length - 1) {
    loadChapter(currentIdx + 1, true);
  }
});

audio.addEventListener('loadedmetadata', () => {
  durTimeLabel.textContent = fmtTime(audio.duration);
  progressTrack.setAttribute('aria-valuemax', String(Math.round(audio.duration)));
});

// 统一的 timeupdate 监听器：进度条 + 文本高亮 + 节流保存 + 锁屏位置同步
audio.addEventListener('timeupdate', () => {
  const cur = audio.currentTime;
  const dur = audio.duration;
  if (dur > 0) {
    const ratio = cur / dur;
    progressFill.style.width = (ratio * 100) + '%';
    progressThumb.style.left = (ratio * 100) + '%';
    progressTrack.setAttribute('aria-valuenow', String(Math.round(ratio * 100)));
  }
  curTimeLabel.textContent = fmtTime(cur);

  // 文本高亮跟随（二分查找）
  const ch = CHAPTERS[currentIdx];
  if (ch && ch.segments) {
    const activeIdx = findActiveSeg(ch.segments, cur);
    if (activeIdx >= 0) highlightSeg(activeIdx);
  }

  // 节流保存（单一进度源，每 5s 一次）
  AB && AB.saveProgress(BOOK_ID, {
    chapterId: currentIdx,
    currentTime: cur,
    volume: audio.volume,
    playbackRate: audio.playbackRate
  });

  // 锁屏 / 系统媒体中心进度同步
  ABUpdatePosition && ABUpdatePosition(audio);
});

// 进度条拖拽
let isDragging = false;
function seekFromEvent(e) {
  const rect = progressTrack.getBoundingClientRect();
  const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
  const ratio = Math.max(0, Math.min(1, x / rect.width));
  if (audio.duration) {
    audio.currentTime = ratio * audio.duration;
    progressFill.style.width = (ratio * 100) + '%';
    progressThumb.style.left = (ratio * 100) + '%';
  }
}
progressTrack.addEventListener('mousedown', (e) => { isDragging = true; progressTrack.classList.add('is-dragging'); seekFromEvent(e); });
document.addEventListener('mousemove', (e) => { if (isDragging) seekFromEvent(e); });
document.addEventListener('mouseup', () => { isDragging = false; progressTrack.classList.remove('is-dragging'); });
progressTrack.addEventListener('touchstart', (e) => { isDragging = true; progressTrack.classList.add('is-dragging'); seekFromEvent(e); }, { passive: true });
progressTrack.addEventListener('touchmove', (e) => { if (isDragging) seekFromEvent(e); }, { passive: true });
progressTrack.addEventListener('touchend', () => { isDragging = false; progressTrack.classList.remove('is-dragging'); });

// 进度条悬停气泡
function showTooltip(e) {
  const rect = progressTrack.getBoundingClientRect();
  const dur = audio.duration;
  if (!dur) { progressTooltip.classList.remove('show'); return; }
  const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
  const ratio = Math.max(0, Math.min(1, x / rect.width));
  progressTooltip.style.left = (ratio * 100) + '%';
  progressTooltip.textContent = fmtTime(ratio * dur) + ' / ' + fmtTime(dur);
  progressTooltip.classList.add('show');
}
progressTrack.addEventListener('mousemove', showTooltip);
progressTrack.addEventListener('mouseleave', () => progressTooltip.classList.remove('show'));

// 键盘控制进度条
progressTrack.addEventListener('keydown', (e) => {
  if (!audio.duration) return;
  const delta = e.shiftKey ? 30 : 5;
  if (e.key === 'ArrowLeft') { e.preventDefault(); audio.currentTime = Math.max(0, audio.currentTime - delta); }
  if (e.key === 'ArrowRight') { e.preventDefault(); audio.currentTime = Math.min(audio.duration, audio.currentTime + delta); }
});

// 高亮段（仅更新变化的节点，避免每帧遍历整章，减少重绘/回流）
function highlightSeg(idx) {
  if (idx < 0 || idx >= segElements.length) return;
  if (idx === lastActiveSegIdx) return;
  const prev = segElements[lastActiveSegIdx];
  if (prev) { prev.classList.remove('active'); prev.removeAttribute('aria-current'); }
  const node = segElements[idx];
  node.classList.add('active');
  node.setAttribute('aria-current', 'true');
  lastActiveSegIdx = idx;
  // 播放中自动滚动跟随；用户手动滚动时暂停跟随
  if (!userScrolling) {
    const readerEl = document.getElementById('reader');
    const rect = node.getBoundingClientRect();
    const containerRect = readerEl.getBoundingClientRect();
    if (rect.top < containerRect.top + 80 || rect.bottom > containerRect.bottom - 80) {
      node.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

// 用户滚动检测：滑动时暂停跟随，停止 3 秒后恢复
(function() {
  const readerEl = document.getElementById('reader');
  if (!readerEl) return;
  const markScrolling = () => {
    userScrolling = true;
    clearTimeout(scrollResumeTimer);
    scrollResumeTimer = setTimeout(() => { userScrolling = false; }, 3000);
  };
  readerEl.addEventListener('touchmove', markScrolling, { passive: true });
  readerEl.addEventListener('wheel', markScrolling, { passive: true });
})();

// 上一章/下一章
prevBtn.addEventListener('click', () => {
  if (currentIdx > 0) loadChapter(currentIdx - 1, isPlaying);
});
nextBtn.addEventListener('click', () => {
  if (currentIdx < CHAPTERS.length - 1) loadChapter(currentIdx + 1, isPlaying);
});

// ±15 秒快退/快进（与键盘 J/K 同步长）
function seekBy(delta) {
  if (!audio.duration) return;
  audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + delta));
}
back15Btn.addEventListener('click', () => seekBy(-15));
fwd15Btn.addEventListener('click', () => seekBy(15));

// 倍速（8 档，与键盘快捷键共用 SPEED_STEPS，持久化；默认 1.0x）
(function initSpeed() {
  speedIdx = SPEED_STEPS.indexOf(1.0); // 默认 1.0x
  try {
    const saved = Number(localStorage.getItem(SPEED_KEY));
    const i = SPEED_STEPS.indexOf(saved);
    if (i >= 0) speedIdx = i;
  } catch (_) {}
  speedBtn.textContent = SPEED_STEPS[speedIdx].toFixed(2).replace(/\.?0+$/, '') + 'x';
})();
function applySpeed(rate, silent) {
  speedIdx = SPEED_STEPS.indexOf(rate);
  if (speedIdx < 0) { speedIdx = 2; rate = SPEED_STEPS[2]; }
  audio.playbackRate = rate;
  speedBtn.textContent = rate.toFixed(2).replace(/\.?0+$/, '') + 'x';
  try { localStorage.setItem(SPEED_KEY, String(rate)); } catch (_) {}
  if (!silent) announce && announce('播放速度 ' + speedBtn.textContent + ' 倍');
}
speedBtn.addEventListener('click', () => {
  applySpeed(SPEED_STEPS[(speedIdx + 1) % SPEED_STEPS.length]);
});

// 侧边栏
menuBtn.addEventListener('click', openSidebar);
overlay.addEventListener('click', closeSidebar);

// ===== 新增功能集成 =====
(function () {
  const AB = window.ABCommon;
  if (!AB) return;

  // --- 1. 缓冲进度 ---
  const bufferBar = document.getElementById('bufferBar');
  if (bufferBar) AB.initBufferProgress(audio, bufferBar);

  // --- 2. 睡眠定时器（带淡出；含「播完本章暂停」档）---
  const timerBtn = document.getElementById('timerBtn');
  const TIMER_CYCLE = [15, 30, 45, 60, 'chapter', 0];
  function updateTimerBtn(result) {
    if (!timerBtn) return;
    if (result === 0) {
      timerBtn.textContent = '定时';
      timerBtn.classList.remove('active');
    } else if (result === 'chapter') {
      timerBtn.textContent = '本章';
      timerBtn.classList.add('active');
    }
  }
  if (timerBtn) {
    sleepTimer = AB.createSleepTimer(audio, {
      fadeDuration: 10000,
      onTick: function (remaining) {
        const mins = Math.ceil(remaining / 60000);
        timerBtn.textContent = mins + '分';
        timerBtn.classList.add('active');
      },
      onEnd: function () {
        timerBtn.textContent = '定时';
        timerBtn.classList.remove('active');
      }
    });

    timerBtn.addEventListener('click', function () {
      if (!sleepTimer) return;
      updateTimerBtn(sleepTimer.cycle(TIMER_CYCLE));
    });
  }

  // --- 3. 键盘快捷键扩展 ---
  AB.initKeyboardShortcuts(audio, {
    seekSmall: 5,
    seekLarge: 10,
    onPrevChapter: function () {
      if (currentIdx > 0) loadChapter(currentIdx - 1, isPlaying);
    },
    onNextChapter: function () {
      if (currentIdx < CHAPTERS.length - 1) loadChapter(currentIdx + 1, isPlaying);
    },
    onTogglePlay: togglePlay,
    onSpeedChange: function (rate) {
      applySpeed(rate, true); // 键盘快捷键内部已播报
    },
    onSleepTimer: function () {
      if (sleepTimer && timerBtn) updateTimerBtn(sleepTimer.cycle(TIMER_CYCLE));
    },
    extraShortcuts: [
      { key: 'F', label: '字号调节', description: '调节阅读字号大小' },
      { key: 'Esc', label: '关闭侧栏', description: '关闭章节目录侧边栏' }
    ]
  });

  // 帮助按钮
  const helpBtn = document.getElementById('helpBtn');
  if (helpBtn) {
    helpBtn.addEventListener('click', function () {
      AB.showShortcutsHelp();
    });
  }

  // dianjing 特有快捷键（F 字号、Esc 关闭侧栏）
  document.addEventListener('keydown', function (e) {
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Escape') {
      closeSidebar();
    }
    if (e.key === 'f' || e.key === 'F') {
      e.preventDefault();
      if (readingCtrl) readingCtrl.cycle(e.shiftKey ? -1 : 1);
    }
  });

  // --- 4. PWA 安装 ---
  const installBtn = document.getElementById('installBtn');
  if (installBtn) {
    AB.initPWAInstall(installBtn, {
      onAvailable: function () {
        installBtn.hidden = false;
      },
      onInstalled: function () {
        installBtn.hidden = true;
      }
    });
  }

  // --- 5. 播放进度持久化（统一格式；卸载时绕过节流直写最新值）---
  window.addEventListener('beforeunload', function () {
    if (CHAPTERS.length > 0) {
      try {
        localStorage.setItem(
          'audiobook-progress-' + BOOK_ID,
          JSON.stringify({
            chapterId: currentIdx,
            currentTime: audio.currentTime,
            volume: audio.volume,
            playbackRate: audio.playbackRate,
            timestamp: Date.now()
          })
        );
      } catch (_) {}
    }
  });

  // --- 6. 播放进度持久化（见上方 beforeunload；timeupdate 节流保存）---
})();

// ===== 继续播放提示（单一进度源；loadData 完成后调用） =====
function checkResumeProgress() {
  if (!CHAPTERS.length) return;
  const progress = AB.loadProgress(BOOK_ID);
  if (!progress || progress.chapterId == null) return;

  // 检查进度是否有效（章节在范围内，且时间大于 5 秒，小于章节时长）
  const chIdx = Number(progress.chapterId);
  const ch = CHAPTERS[chIdx];
  if (!ch || !progress.currentTime || progress.currentTime < 5) return;
  if (progress.currentTime >= ch.duration - 5) return;

  // 进度较新（7 天内）才提示
  const age = Date.now() - (progress.timestamp || 0);
  if (age > 7 * 24 * 60 * 60 * 1000) return;

  AB.showResumePrompt(progress, {
    chapterTitle: ch.title,
    onConfirm: function (p) {
      const idx = Number(p.chapterId);
      if (idx !== currentIdx) {
        loadChapter(idx, false);
      }
      // 等音频就绪后 seek
      const doSeek = function () {
        if (audio.duration && p.currentTime < audio.duration) {
          audio.currentTime = p.currentTime;
        }
        audio.play().catch(function () {});
        audio.removeEventListener('canplay', doSeek);
      };
      if (audio.readyState >= 1) doSeek();
      else audio.addEventListener('canplay', doSeek);

      // 恢复音量和速率
      if (p.volume != null) audio.volume = p.volume;
      if (p.playbackRate != null) audio.playbackRate = p.playbackRate;
    },
    onCancel: function () {
      // 「从头开始」真正归零：清除统一进度并回到本章起点
      AB.clearProgress(BOOK_ID);
      try { audio.currentTime = 0; } catch (_) {}
    }
  });
}

// ===== Media Session API (包装 ABCommon) =====
function updateMediaSession() {
  ABUpdateMediaSession && ABUpdateMediaSession(audio, CHAPTERS[currentIdx], {
    artist: '电竞群像',
    album: '电竞群像 · 有声书',
    onPrev: () => { if (currentIdx > 0) loadChapter(currentIdx - 1, isPlaying); },
    onNext: () => { if (currentIdx < CHAPTERS.length - 1) loadChapter(currentIdx + 1, isPlaying); }
  });
}

// ===== URL hash 路由 (包装 ABCommon) =====
function applyHashRoute() { ABHashRoute && ABHashRoute(CHAPTERS, (idx) => { if (idx !== currentIdx) loadChapter(idx, false); }); }
function updateHash() { ABUpdateHash && ABUpdateHash(currentIdx); }
window.addEventListener('hashchange', () => { applyHashRoute(); });

// ===== 全局错误处理 =====
window.addEventListener('error', (e) => { console.error('Global error:', e.error || e.message); });
window.addEventListener('unhandledrejection', (e) => { console.error('Unhandled promise rejection:', e.reason); });

// ===== 离线缓存管理（SW 消息通道驱动：预取走 PREFETCH_AUDIO，统计走 QUERY_CACHED_AUDIO/CACHE_INFO） =====
(() => {
  /* 注册 Service Worker（更新后自动接管，避免旧 SW 消息 API 缺失导致预取丢失）
   * 注册 URL 带版本参数：sw.js 被 GitHub Pages 缓存 max-age=600（10 分钟），
   * 不带参数时用户在缓存窗口内刷新仍会命中旧 SW（例如音频 Range 转发缺陷的 v11）。
   * 版本化 scriptURL 会强制浏览器拉取指定版本，更新两步到位（与 sw.js 内 VERSION 同步递增；
   * 配合 common.js 的 controllerchange 自动刷新，旧 SW 用户一次访问即收敛到新版本）。 */
  AB.registerServiceWorker && AB.registerServiceWorker('sw.js?v=14');

  const cacheToggle = document.getElementById('cacheToggle');
  const cachePopup = document.getElementById('cachePopup');
  const cacheIcon = document.getElementById('cacheIcon');
  const cacheBadge = document.getElementById('cacheBadge');
  const cacheStatusText = document.getElementById('cacheStatusText');
  const cacheProgressBar = document.getElementById('cacheProgressBar');
  const cacheCountText = document.getElementById('cacheCountText');
  const cacheHint = document.getElementById('cacheHint');
  const cacheStartBtn = document.getElementById('cacheStartBtn');
  const cacheStopBtn = document.getElementById('cacheStopBtn');
  const cacheClearBtn = document.getElementById('cacheClearBtn');

  /* 默认开启持续缓存；用户点击"暂停"后设为 false 并持久化 */
  let autoCacheEnabled = (function () {
    try { const raw = localStorage.getItem('dianjing_auto_cache'); return raw == null ? true : raw !== 'false'; }
    catch (_) { return true; }
  })();

  let prefetching = false;
  let currentRunId = 0;
  let cachedCount = 0;
  let audioSize = 0;
  let audioLimit = 650 * 1024 * 1024; // 与 SW 默认上限一致；CACHE_INFO 会回传实际值
  let limitNotified = false;
  /* 数据未加载完成时，预缓存会被延迟到 loadData 成功后 */
  let dataReady = CHAPTERS.length > 0;

  function getAllAudioUrls() {
    return AB.audioUrls ? AB.audioUrls(CHAPTERS) : [];
  }

  function fmtMB(bytes) {
    return Math.round((bytes || 0) / 1024 / 1024) + 'MB';
  }

  /* 渲染 UI（cachedCount/audioSize/audioLimit 由 SW 消息回调更新） */
  function renderCacheUI() {
    if (!cacheToggle) return;
    const total = CHAPTERS.length;
    const pct = total > 0 ? (cachedCount / total * 100) : 0;
    if (cacheProgressBar) cacheProgressBar.style.width = pct.toFixed(1) + '%';
    if (cacheCountText) cacheCountText.textContent = cachedCount + ' / ' + total + ' 章';
    if (cacheBadge) {
      cacheBadge.textContent = cachedCount;
      cacheBadge.hidden = cachedCount === 0;
    }

    const online = navigator.onLine;
    if (cacheStatusText) {
      cacheStatusText.textContent = online ? '在线' : '离线';
      cacheStatusText.className = 'cache-status ' + (online ? 'online' : 'offline');
    }

    let hint = '有网络时自动缓存后续章节，断网也能听';
    if (total > 0 && cachedCount >= total) {
      hint = '全部章节已缓存，断网也能听';
      if (cacheStartBtn) { cacheStartBtn.disabled = true; cacheStartBtn.textContent = '已完成'; }
    } else if (!online) {
      hint = '当前离线，连接网络后可继续缓存';
      if (cacheStartBtn) cacheStartBtn.disabled = true;
    } else {
      if (cacheStartBtn) { cacheStartBtn.disabled = false; cacheStartBtn.textContent = autoCacheEnabled ? '继续缓存' : '开始缓存'; }
    }
    /* 容量上限提示（GET_CACHE_INFO 回传实际上限） */
    if (audioLimit && audioSize >= audioLimit * 0.95) {
      hint = '已达缓存上限 ' + fmtMB(audioLimit) + '，最久未听的章节会自动清理';
      if (!limitNotified) {
        limitNotified = true;
        showToast && showToast('音频缓存已达上限，将自动清理最旧章节');
      }
    }
    if (cacheHint) cacheHint.textContent = hint;

    if (cacheStopBtn) cacheStopBtn.hidden = !prefetching;
    if (cacheStartBtn) cacheStartBtn.hidden = prefetching || (total > 0 && cachedCount >= total);
    if (cacheToggle) cacheToggle.classList.toggle('active', prefetching);
    if (cacheIcon) cacheIcon.classList.toggle('prefetching', prefetching);
  }

  /* 向 SW 查询已缓存列表与容量统计（异步回传后重渲染） */
  function queryState() {
    AB.sendToServiceWorker && AB.sendToServiceWorker({ type: 'QUERY_CACHED_AUDIO' });
    AB.sendToServiceWorker && AB.sendToServiceWorker({ type: 'GET_CACHE_INFO' });
  }

  /* 开始预取：当前章节之后优先，走到末尾后再从头补齐；由 SW 下载并写入音频缓存 */
  function startPrefetch() {
    if (prefetching || !dataReady || CHAPTERS.length === 0) return;
    if (!navigator.onLine) { renderCacheUI(); return; }
    if (cachedCount >= CHAPTERS.length) { renderCacheUI(); return; }

    prefetching = true;
    const runId = ++currentRunId;
    renderCacheUI();

    const allUrls = getAllAudioUrls();
    const ordered = [...allUrls.slice(currentIdx), ...allUrls.slice(0, currentIdx)];
    AB.sendToServiceWorker && AB.sendToServiceWorker({ type: 'PREFETCH_AUDIO', urls: ordered, runId: runId });
  }

  /* 暂停：用户主动停止，并持久化状态 */
  function stopPrefetch() {
    autoCacheEnabled = false;
    try { localStorage.setItem('dianjing_auto_cache', 'false'); } catch (_) {}
    ++currentRunId;
    prefetching = false;
    AB.sendToServiceWorker && AB.sendToServiceWorker({ type: 'PREFETCH_STOP' });
    renderCacheUI();
    showToast && showToast('已暂停自动缓存，可随时继续');
  }

  /* 启用：用户主动开启，并持久化状态 */
  function startManual() {
    autoCacheEnabled = true;
    try { localStorage.setItem('dianjing_auto_cache', 'true'); } catch (_) {}
    startPrefetch();
  }

  /* 清除全部缓存（仅删音频缓存，外壳不受影响；由 SW 执行并广播） */
  function clearCache() {
    prefetching = false;
    AB.sendToServiceWorker && AB.sendToServiceWorker({ type: 'CLEAR_AUDIO_CACHE' });
    cachedCount = 0;
    renderCacheUI();
    showToast && showToast('已清除缓存');
  }

  /* 监听 SW 消息 */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', (e) => {
      const d = e.data || {};
      if (d.type === 'CACHED_AUDIO_LIST') {
        const urls = new Set(getAllAudioUrls());
        cachedCount = (d.urls || []).filter((u) => urls.has(u)).length;
        renderCacheUI();
      } else if (d.type === 'CACHE_INFO') {
        if (d.audioLimit) audioLimit = d.audioLimit;
        audioSize = d.audioSize || 0;
        renderCacheUI();
      } else if (d.type === 'PREFETCH_DONE') {
        if (d.runId != null && d.runId !== currentRunId) return; // 过期轮次
        prefetching = false;
        queryState();
        if (cachedCount >= CHAPTERS.length) showToast && showToast('全部章节已缓存');
      } else if (d.type === 'AUDIO_CACHE_CLEARED') {
        queryState();
      }
    });
  }

  /* 事件绑定 */
  if (cacheToggle) {
    cacheToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      cachePopup.classList.toggle('open');
      cacheToggle.setAttribute('aria-expanded', String(cachePopup.classList.contains('open')));
    });
  }
  if (cacheStartBtn) cacheStartBtn.addEventListener('click', startManual);
  if (cacheStopBtn) cacheStopBtn.addEventListener('click', stopPrefetch);
  if (cacheClearBtn) cacheClearBtn.addEventListener('click', clearCache);

  document.addEventListener('click', (e) => {
    if (cachePopup && cachePopup.classList.contains('open') && !e.target.closest('.cache-panel')) {
      cachePopup.classList.remove('open');
      if (cacheToggle) cacheToggle.setAttribute('aria-expanded', 'false');
    }
  });

  /* 网络状态变化时更新 UI；重新联网后自动从断点继续 */
  window.addEventListener('online', () => { queryState(); if (autoCacheEnabled) window.setTimeout(startPrefetch, 300); });
  window.addEventListener('offline', () => { renderCacheUI(); });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && navigator.onLine && autoCacheEnabled && !prefetching && dataReady) startPrefetch();
  });

  /* 申请持久化存储，避免移动端浏览器在空间紧张时优先清理音频缓存 */
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  /* 暴露给 loadData 调用：数据加载完成后启动持续缓存 */
  window.__dianjingStartCache = function () {
    dataReady = true;
    queryState();
    if (navigator.onLine && autoCacheEnabled) window.setTimeout(startPrefetch, 800);
  };
})();

// 初始化
loadData();
</script>

<script>
/* 交互动效增强：播放/暂停键弹跳反馈（附加监听，不影响主逻辑） */
(function () {
  'use strict';
  var audioEl = document.getElementById('audio');
  var pBtn = document.getElementById('playBtn');
  if (!audioEl || !pBtn) return;
  function pop() {
    pBtn.classList.remove('is-pop');
    pBtn.addEventListener('animationend', function onEnd() { pBtn.classList.remove('is-pop'); pBtn.removeEventListener('animationend', onEnd); });
    requestAnimationFrame(function() { pBtn.classList.add('is-pop'); });
  }
  audioEl.addEventListener('play', pop);
  audioEl.addEventListener('pause', pop);
})();
</script>
</body>
