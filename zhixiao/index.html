<style>
:root {
  color-scheme: light;
  --bg: #f7f1e8;
  --surface: #fffaf4;
  --surface-light: #efe4d5;
  --text: #2f2923;
  --text-dim: #8b7d70;
  --accent: #b66b3f;
  --accent-deep: #8f4f2c;
  --accent-glow: rgba(182,107,63,0.12);
  --highlight: rgba(182,107,63,0.10);
  --gold: #c7954f;
  --border: #e5d8c9;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #211b18;
  --surface: #312721;
  --surface-light: #30241e;
  --text: #f3e9dd;
  --text-dim: #b4a294;
  --accent: #dc9968;
  --accent-deep: #f0b184;
  --accent-glow: rgba(220,153,104,0.16);
  --highlight: rgba(220,153,104,0.12);
  --gold: #d8ad68;
  --border: #55443a;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body {
  background:
    radial-gradient(circle at 10% 0%, rgba(199,149,79,.15), transparent 34rem),
    radial-gradient(circle at 100% 20%, rgba(182,107,63,.11), transparent 30rem),
    var(--bg);
  color: var(--text);
  font-family: "Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background 0.3s, color 0.3s;
  -webkit-tap-highlight-color: transparent;
  contain: layout style;
}
header {
  text-align: center;
  padding: 16px 20px 14px;
  border-bottom: 1px solid var(--border);
  position: relative;
  flex-shrink: 0;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: var(--text);
}
.brand-mark {
  width: 38px; height: 38px; border-radius: 12px;
  display: grid; place-items: center;
  color: #fff8ef; background: linear-gradient(145deg, var(--accent), var(--gold));
  box-shadow: 0 8px 18px rgba(182,107,63,.24);
  font-family: "Noto Serif SC","Source Han Serif SC",serif; font-size: 19px;
  transition: transform .25s cubic-bezier(.22,.61,.36,1);
}
.brand:hover .brand-mark { transform: scale(1.06) rotate(-3deg); }
.brand-body { display: flex; flex-direction: column; line-height: 1.1; text-align: left; }
.brand-title { font-size: 1.5rem; font-weight: 400; letter-spacing: 0.4em; color: var(--accent); }
.brand-sub { font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.18em; margin-top: 3px; }
.header-btns {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  gap: 8px;
}
.icon-btn {
  background: var(--surface-light);
  border: 1px solid var(--border);
  color: var(--text);
  width: 36px; height: 36px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  touch-action: manipulation;
}
.icon-btn:hover { background: var(--accent-glow); border-color: var(--accent); }
.menu-btn {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
}

/* 侧边目录 */
.sidebar {
  position: fixed;
  left: -320px;
  top: 0;
  width: 300px;
  height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  transition: left 0.3s ease;
  z-index: 200;
  padding: 20px 0;
  contain: layout style;
}
.sidebar.open { left: 0; }
.sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 150;
  display: none;
}
.sidebar-overlay.show { display: block; }
.sidebar h3 {
  font-size: 0.9rem;
  color: var(--accent);
  letter-spacing: 0.2em;
  padding: 0 20px 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}
.sidebar a {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 9px 18px 9px 16px;
  color: var(--text-dim);
  text-decoration: none;
  font-size: 0.85rem;
  transition: background 0.22s ease, color 0.22s ease, border-left-color 0.22s ease, padding-left 0.22s ease;
  border-left: 3px solid transparent;
  border-radius: 0 8px 8px 0;
  margin: 1px 0;
  position: relative;
  animation: ab-toc-in 0.5s ease both;
}
.sidebar a::before {
  content: "";
  position: absolute;
  left: 0; top: 6px; bottom: 6px;
  width: 3px;
  background: var(--accent);
  border-radius: 0 3px 3px 0;
  transform: scaleY(0);
  transform-origin: center;
  transition: transform 0.25s cubic-bezier(0.22, 0.61, 0.36, 1);
  pointer-events: none;
}
.sidebar a:hover {
  color: var(--text);
  background: var(--accent-glow);
  padding-left: 19px;
}
.sidebar a:hover::before {
  transform: scaleY(0.65);
}
.sidebar a.active {
  color: var(--accent);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  border-left-color: var(--accent);
  font-weight: 600;
}
.sidebar a.active::before {
  transform: scaleY(1);
  box-shadow: 0 0 12px var(--accent);
}
.sidebar a .ch-dur {
  font-size: 0.7rem;
  color: var(--text-dim);
  opacity: 0.65;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
  transition: opacity 0.22s ease, color 0.22s ease;
}
.sidebar a:hover .ch-dur {
  opacity: 1;
  color: var(--accent);
}
@keyframes ab-toc-in {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}

/* 主内容区 */
.main-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.reader {
  flex: 1;
  overflow-y: auto;
  max-width: 680px;
  width: 100%;
  margin: 0 auto;
  padding: 32px 24px 40px;
  -webkit-overflow-scrolling: touch;
}
.chapter-title {
  font-size: 1.4rem;
  font-weight: 400;
  color: var(--accent);
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  letter-spacing: 0.05em;
}
.chapter-content {
  font-size: 1.05rem;
  line-height: 2;
  letter-spacing: 0.02em;
}
.seg {
  cursor: pointer;
  border-radius: 4px;
  transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
  padding: 1px 3px;
}
.seg:hover { background: var(--surface-light); color: var(--text); transform: translateY(-1px); }
.seg.active {
  background: var(--highlight);
  color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  transition: background .15s ease, box-shadow .25s ease, color .15s ease;
}
.seg.flash {
  animation: ab-seg-flash .7s ease;
}
@keyframes ab-seg-flash {
  0%   { background: var(--accent); color: #fff; box-shadow: 0 0 0 4px var(--accent); transform: scale(1.04); }
  100% { background: var(--highlight); color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); transform: scale(1); }
}

/* 底部播放栏 */
.player-bar {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.play-btn {
  background: var(--accent);
  border: none;
  color: var(--bg);
  width: 44px; height: 44px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1.1rem;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  touch-action: manipulation;
}
.play-btn:hover { opacity: 0.85; }
.play-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.player-info {
  flex: 1;
  min-width: 0;
}
.player-title {
  font-size: 0.8rem;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}
.progress-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.time-label {
  font-size: 0.7rem;
  color: var(--text-dim);
  font-family: monospace;
  flex-shrink: 0;
  min-width: 36px;
  text-align: center;
}
.progress-track {
  flex: 1;
  height: 6px;
  background: var(--surface-light);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: height .22s ease;
}
.progress-track:hover { height: 9px; }
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, transparent));
  border-radius: 3px;
  width: 0%;
  transition: width 0.1s linear;
  position: relative;
}
.progress-fill::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.45) 50%, transparent 100%);
  transform: translateX(-100%);
  animation: ab-fill-shimmer 2.4s ease-in-out infinite;
  pointer-events: none;
}
@keyframes ab-fill-shimmer {
  0%   { transform: translateX(-100%); }
  60%  { transform: translateX(120%); }
  100% { transform: translateX(120%); }
}
.progress-track:hover .progress-fill { opacity: 0.95; }
.progress-tooltip {
  position: absolute;
  top: -22px;
  left: 0;
  transform: translateX(-50%);
  padding: 2px 6px;
  border-radius: 5px;
  background: var(--accent);
  color: var(--bg);
  font-size: 0.65rem;
  font-family: monospace;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s ease;
}
.progress-tooltip.show { opacity: 1; }
.speed-btn, .font-size-btn {
  background: var(--surface-light);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 4px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.75rem;
  font-family: inherit;
  flex-shrink: 0;
  transition: all 0.2s;
  touch-action: manipulation;
}
.speed-btn:hover, .font-size-btn:hover { border-color: var(--accent); color: var(--accent); }
.font-size-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-glow); }

/* 导航按钮 */
.nav-btns {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.nav-btn {
  background: var(--surface-light);
  border: 1px solid var(--border);
  color: var(--text);
  width: 36px; height: 36px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.85rem;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  touch-action: manipulation;
}
.nav-btn:hover { background: var(--accent-glow); border-color: var(--accent); }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* 加载态 */
.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}
.loading p { animation: pulse 1.4s ease infinite; }
@keyframes pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
.loading .spinner {
  display: inline-block;
  width: 32px; height: 32px;
  border: 3px solid var(--surface-light);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 顶部进度条 */
.top-progress {
  position: fixed;
  top: 0; left: 0;
  height: 3px;
  background: var(--accent);
  z-index: 300;
  transition: width .55s cubic-bezier(.22,.61,.36,1);
}

/* 章节搜索 */
.sidebar-search {
  padding: 12px 20px 8px;
  border-bottom: 1px solid var(--border);
  position: relative;
}
.sidebar-search input {
  width: 100%;
  background: var(--surface-light);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 10px 8px 30px;
  border-radius: 8px;
  font-size: 0.85rem;
  font-family: inherit;
  outline: none;
  transition: border-color .15s;
}
.sidebar-search input:focus { border-color: var(--accent); }
.sidebar-search::before {
  content: "⌕";
  position: absolute;
  left: 32px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 0.95rem;
  pointer-events: none;
}

/* 阅读字号变量 */
.reader { font-size: calc(1rem * var(--reading-size, 1)); }
.reader .chapter-content { font-size: calc(1.05rem * var(--reading-size, 1)); }

/* 主题图标动效 */
#themeBtn { transition: transform .35s cubic-bezier(.22,.61,.36,1); }
#themeBtn.spinning { transform: rotate(180deg); }

/* 入场动画 */
@keyframes ab-fade-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
header, .reader, .player-bar { animation: ab-fade-up .55s ease both; }
header { animation-delay: .05s; }
.reader { animation-delay: .15s; }
.player-bar { animation-delay: .25s; }

/* 章节标题：带渐显 + 下划线扫过 */
.chapter-title {
  position: relative;
  animation: ab-title-in .55s cubic-bezier(.22,.61,.36,1) both;
}
.chapter-title::after {
  content: "";
  position: absolute;
  left: 0; bottom: -1px;
  width: 0; height: 1px;
  background: linear-gradient(90deg, var(--accent), transparent);
  animation: ab-underline .9s .25s cubic-bezier(.22,.61,.36,1) forwards;
}
@keyframes ab-title-in {
  from { opacity: 0; transform: translateY(8px); letter-spacing: .12em; }
  to { opacity: 1; transform: translateY(0); letter-spacing: .05em; }
}
@keyframes ab-underline { to { width: 56px; } }

/* 侧边栏切换图标动效 */
.menu-btn { transition: transform .35s cubic-bezier(.22,.61,.36,1), background .22s ease, border-color .22s ease; }
.menu-btn:hover { transform: rotate(90deg) translateY(0); }

/* icon-btn：统一提升 */
.icon-btn { transition: background .22s ease, border-color .22s ease, color .22s ease, transform .22s cubic-bezier(.22,.61,.36,1); }
.icon-btn:active { transform: scale(.9); }

/* 播放按钮：脉冲呼吸 */
.play-btn { position: relative; transition: transform .2s cubic-bezier(.22,.61,.36,1), background .2s ease, box-shadow .2s ease; }
.play-btn .icon-play, .play-btn .icon-pause {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  transition: opacity .22s ease, transform .28s cubic-bezier(.22,.61,.36,1);
}
.play-btn .icon-pause { opacity: 0; transform: translate(-50%,-50%) scale(.5); }
.play-btn.playing .icon-play { opacity: 0; transform: translate(-50%,-50%) scale(.5); }
.play-btn.playing .icon-pause { opacity: 1; transform: translate(-50%,-50%) scale(1); }
.play-btn:not(:disabled)::before {
  content: "";
  position: absolute; inset: -3px;
  border-radius: 50%;
  border: 1.5px solid var(--accent);
  opacity: 0;
  pointer-events: none;
  animation: ab-play-pulse 2.4s ease-out infinite;
}
@keyframes ab-play-pulse {
  0%   { transform: scale(.92); opacity: .65; }
  70%  { transform: scale(1.18); opacity: 0; }
  100% { transform: scale(1.18); opacity: 0; }
}
.play-btn:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 30%, transparent); }
.play-btn:active:not(:disabled) { transform: scale(.96); }

/* speed-btn / font-size-btn：按下反馈 */
.speed-btn, .font-size-btn { transition: background .18s ease, border-color .18s ease, color .18s ease, transform .18s cubic-bezier(.22,.61,.36,1); }
.speed-btn:active, .font-size-btn:active { transform: scale(.92); }

/* nav-btn：章节翻页按钮 */
.nav-btn { transition: background .18s ease, border-color .18s ease, color .18s ease, transform .2s cubic-bezier(.22,.61,.36,1); }
.nav-btn:hover:not(:disabled) { transform: translateY(-1px); }
.nav-btn:active:not(:disabled) { transform: scale(.9); }
.nav-btn:disabled { opacity: .25; }

@media (max-width: 768px) {
  header { padding: 14px 16px 12px; }
  .brand-title { font-size: 1.3rem; }
  .brand-mark { width: 34px; height: 34px; font-size: 17px; }
  .menu-btn { left: 12px; }
  .header-btns { right: 12px; }
  .reader { padding: 20px 16px 30px; }
  .chapter-title { font-size: 1.2rem; }
  .chapter-content { font-size: 0.95rem; line-height: 1.9; }
  .player-bar { padding: 8px 12px; gap: 8px; }
  .play-btn { width: 44px; height: 44px; font-size: 1rem; }
  .speed-btn, .font-size-btn { padding: 4px 8px; font-size: 0.72rem; }
  .nav-btn { width: 38px; height: 38px; font-size: 0.8rem; }
  .player-title { font-size: 0.75rem; }
  .sidebar { width: 85vw; max-width: 320px; left: -85vw; }
  .sidebar.open { left: 0; }
  .sidebar a { padding: 12px 20px; font-size: 0.9rem; }
  .sidebar h3 { font-size: 1rem; }
}
@media (max-width: 480px) {
  .brand-title { font-size: 1.15rem; letter-spacing: 0.3em; }
  .brand-sub { font-size: 0.65rem; }
  .brand-mark { width: 32px; height: 32px; font-size: 16px; }
  .icon-btn { width: 34px; height: 34px; font-size: 0.9rem; }

  .player-bar .nav-btns { order: 10; width: 100%; justify-content: center; }
  .player-bar .speed-btn, .player-bar .font-size-btn { font-size: 0.68rem; }
  .time-label { font-size: 0.65rem; min-width: 32px; }
}

/* 触摸设备优化 */
@media (hover: none) and (pointer: coarse) {
  .icon-btn:hover, .nav-btn:hover, .speed-btn:hover, .font-size-btn:hover {
    background: var(--surface-light); border-color: var(--border); color: var(--text);
  }
  .icon-btn:active, .nav-btn:active { transform: scale(0.92); }
  .sidebar a:hover { background: transparent; border-left-color: transparent; padding-left: 16px; }
  .sidebar a:hover::before { transform: scaleY(0); }
  .sidebar a:active { background: var(--surface-light); }
  /* 触屏禁用菜单按钮 90° 旋转 + 标题下划线扫过 + 持续脉冲，节电 */
  .menu-btn:hover { transform: none; }
  .chapter-title::after { animation: none; width: 56px; }
  .play-btn:not(:disabled)::before { animation: none; opacity: 0; }
  .progress-track:hover { height: 6px; }
}

/* 离线缓存浮动面板（持续自动缓存） */
.cache-panel {
  position: fixed; z-index: 25; right: 16px; bottom: 100px;
}
.cache-toggle {
  width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--surface-light);
  color: var(--text-dim); cursor: pointer;
  display: grid; place-items: center; font-size: 18px; position: relative;
  box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  transition: all .2s;
}
.cache-toggle:hover { border-color: var(--accent); color: var(--accent); }
.cache-toggle.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.cache-badge {
  position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px;
  border-radius: 9px; background: var(--accent); color: var(--bg);
  font-size: 10px; font-weight: 700;
  display: grid; place-items: center; padding: 0 4px;
}
.cache-popup {
  display: none; position: absolute; right: 0; bottom: 52px;
  width: 280px; padding: 16px; border-radius: 16px;
  border: 1px solid var(--border); background: var(--surface);
  box-shadow: 0 12px 40px rgba(0,0,0,0.28);
}
.cache-popup.open { display: block; }
.cache-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.cache-title { font-size: 14px; font-weight: 700; color: var(--accent); }
.cache-status { font-size: 11px; color: var(--text-dim); }
.cache-status.online { color: #2f7d4a; }
.cache-status.offline { color: var(--accent); }
.cache-progress-wrap { margin-bottom: 8px; }
.cache-progress { height: 6px; border-radius: 3px; background: var(--surface-light); overflow: hidden; }
.cache-progress > span {
  display: block; height: 100%; width: 0; border-radius: inherit;
  background: var(--accent); transition: width .3s;
}
.cache-count { display: block; margin-top: 5px; font-size: 11px; color: var(--text-dim); text-align: right; }
.cache-hint { margin: 0 0 12px; font-size: 11px; color: var(--text-dim); line-height: 1.5; }
.cache-actions { display: flex; gap: 8px; }
.cache-btn {
  flex: 1; padding: 8px 0; border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface-light); color: var(--text); cursor: pointer;
  font-size: 12px; font-family: inherit;
  transition: all .15s;
}
.cache-btn:hover { border-color: var(--accent); color: var(--accent); }
.cache-btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.cache-btn.primary:hover { opacity: 0.85; }
.cache-btn:disabled { opacity: .45; cursor: not-allowed; }
/* 移动端：避让底部播放器，移到导航条下方 */
@media (max-width: 480px) {
  .cache-panel { right: 12px; bottom: 130px; }
  .cache-toggle { width: 40px; height: 40px; }
  .cache-popup { width: calc(100vw - 24px); max-width: 320px; }
}

/* 安全区域适配（刘海屏/底部横条） */
@supports (padding-bottom: env(safe-area-inset-bottom)) {
  header { padding-top: calc(16px + env(safe-area-inset-top)); }
  .player-bar { padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
}

/* 高对比度模式 */
@media (prefers-contrast: more) {
  .seg.active { box-shadow: 0 0 0 2px var(--accent); }
  .icon-btn, .nav-btn, .speed-btn, .font-size-btn { border-width: 2px; }
}

/* ===== 交互动效升级 ===== */
/* 章节内容入场（节点随章节切换重建，动画自动重放） */
.chapter-content { animation: ab-content-in .5s cubic-bezier(.22,.61,.36,1) both; }
@keyframes ab-content-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* 骨架屏加载（替代 spinner） */
.skeleton-wrap { padding: 4px 0; }
.skeleton { position: relative; overflow: hidden; background: var(--surface-light); border-radius: 6px; }
.skeleton::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--text) 9%, transparent), transparent);
  transform: translateX(-100%);
  animation: ab-sk 1.4s ease-in-out infinite;
}
@keyframes ab-sk { 60% { transform: translateX(100%); } 100% { transform: translateX(100%); } }
.sk-title { width: 44%; height: 26px; margin-bottom: 30px; }
.sk-line { height: 15px; margin-bottom: 20px; }

/* 侧栏遮罩淡入淡出 */
.sidebar-overlay { display: block; opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility 0s linear .32s; }
.sidebar-overlay.show { opacity: 1; visibility: visible; transition: opacity .3s ease; }

/* 侧栏滑动缓动升级 */
.sidebar { transition: left .38s cubic-bezier(.22,.61,.36,1); }

/* 目录条目：打开侧栏时才播 stagger（配合 JS 逐项 delay） */
.sidebar a { animation: none; }
.sidebar.open a { animation: ab-toc-in .45s cubic-bezier(.22,.61,.36,1) both; }

/* 进度条拇指：悬停/拖拽时浮现 */
.progress-thumb {
  position: absolute; top: 50%; left: 0; z-index: 2;
  width: 13px; height: 13px; border-radius: 50%;
  background: var(--accent); border: 2.5px solid var(--surface);
  box-shadow: 0 1px 5px rgba(0,0,0,.35);
  transform: translate(-50%,-50%) scale(0);
  transition: transform .18s cubic-bezier(.22,.61,.36,1);
  pointer-events: none;
}
.progress-track:hover .progress-thumb,
.progress-track.is-dragging .progress-thumb { transform: translate(-50%,-50%) scale(1); }

/* 播放键状态切换弹跳 */
.play-btn.is-pop { animation: ab-pop .3s cubic-bezier(.22,.61,.36,1); }
@keyframes ab-pop { 0% { transform: scale(.84); } 60% { transform: scale(1.07); } 100% { transform: scale(1); } }

/* 缓存弹层：弹入 */
.cache-popup {
  display: block; opacity: 0; visibility: hidden;
  transform: translateY(10px) scale(.97); transform-origin: bottom right;
  transition: opacity .24s ease, transform .3s cubic-bezier(.22,.61,.36,1), visibility 0s linear .3s;
}
.cache-popup.open { opacity: 1; visibility: visible; transform: none; transition: opacity .24s ease, transform .3s cubic-bezier(.22,.61,.36,1); }

/* 减少动态偏好：新增动画直出 */
@media (prefers-reduced-motion: reduce) {
  .chapter-content, .sidebar.open a, .skeleton::after { animation: none !important; }
  .play-btn .icon-play, .play-btn .icon-pause { transition: none !important; }
}

/* 内联错误条（播放器上方） */
.player-bar { position: relative; }

<script>
'use strict';

function safeGetStorage(key) {
  try { return localStorage.getItem(key); } catch (e) { console.error('LocalStorage read error:', e); return null; }
}
function safeSetStorage(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { console.error('LocalStorage write error:', e); }
}

const AB = window.ABCommon;
if (!AB) { document.body.insertAdjacentHTML('beforeend', '<p style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#000;padding:16px;border-radius:8px;z-index:99999">共享脚本未加载</p>'); }
const { fmtTime, findActiveSeg, applyHashRoute: ABHashRoute, updateHash: ABUpdateHash, updateMediaSession: ABUpdateMediaSession, saveThrottled, showToast, announce } = AB || {};

let CHAPTERS = [];
let currentIdx = 0;
let isPlaying = false;
let speeds = [1.0, 1.25, 1.5, 2.0];
let speedIdx = 0;
let segElements = [];
let autoPlayNext = true;
let isFirstLoad = true;
let userScrolling = false;
let scrollResumeTimer = null;
let lastActiveSegIdx = -1;

let isFirstRender = true;

const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const speedBtn = document.getElementById('speedBtn');
const themeBtn = document.getElementById('themeBtn');
const fontSizeBtn = document.getElementById('fontSizeBtn');
const menuBtn = document.getElementById('menuBtn');
const progressTrack = document.getElementById('progressTrack');
const progressFill = document.getElementById('progressFill');
const progressThumb = document.getElementById('progressThumb');
const progressTooltip = document.getElementById('progressTooltip');
const curTimeLabel = document.getElementById('curTime');
const durTimeLabel = document.getElementById('durTime');
const playerTitle = document.getElementById('playerTitle');
const topProgress = document.getElementById('topProgress');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

// ===== 主题 =====
function initTheme() {
  const saved = safeGetStorage('zhixiao_theme');
  if (saved === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeBtn.textContent = '🌙';
  } else if (saved === 'light') {
    document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = '☀';
  } else {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (prefersDark) {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = '🌙';
    } else {
      themeBtn.textContent = '☀';
    }
  }
}
function toggleTheme() {
  themeBtn.classList.add('spinning');
  setTimeout(() => themeBtn.classList.remove('spinning'), 380);
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    safeSetStorage('zhixiao_theme', 'light');
    themeBtn.textContent = '☀';
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    safeSetStorage('zhixiao_theme', 'dark');
    themeBtn.textContent = '🌙';
  }
  announce && announce(isDark ? '已切换到浅色主题' : '已切换到深色主题');
}

// ===== 阅读字号 =====
const readingSizeKey = 'zhixiao_reading_size';
const sizes = [1, 1.15, 1.3];
let sizeIdx = Math.max(0, sizes.indexOf(Number(safeGetStorage(readingSizeKey)) || 1));
function applyReadingSize() {
  document.documentElement.style.setProperty('--reading-size', String(sizes[sizeIdx]));
  fontSizeBtn.classList.toggle('active', sizeIdx !== 0);
  fontSizeBtn.setAttribute('aria-label', '阅读字号：' + Math.round(sizes[sizeIdx] * 100) + '%');
  fontSizeBtn.textContent = sizes[sizeIdx] === 1 ? 'Aa' : (sizes[sizeIdx] >= 1.3 ? 'Aa++' : 'Aa+');
  announce && announce('字号已调为 ' + Math.round(sizes[sizeIdx] * 100) + '%');
}
fontSizeBtn.addEventListener('click', () => {
  sizeIdx = (sizeIdx + 1) % sizes.length;
  safeSetStorage(readingSizeKey, String(sizes[sizeIdx]));
  applyReadingSize();
});
applyReadingSize();

// ===== 数据格式归一化（兼容 v1 扁平数组 / v2 book+chapters） =====
function normalizeChapters(data) {
  if (Array.isArray(data)) {
    // v1 格式：扁平数组
    return data;
  }
  if (data && typeof data === 'object' && Array.isArray(data.chapters)) {
    // v2 格式：{ version, book, chapters }
    // 同时将 book 元数据挂到全局，供后续使用
    window.BOOK_INFO = data.book || null;
    return data.chapters;
  }
  return [];
}

// ===== 加载数据 =====
async function loadData() {
  try {
    const resp = await fetch('data.json');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const raw = await resp.json();
    CHAPTERS = normalizeChapters(raw);
    document.getElementById('initLoading').style.display = 'none';
    buildTOC();
    const saved = parseInt(safeGetStorage('zhixiao_chapter') || '0', 10);
    currentIdx = isNaN(saved) ? 0 : Math.min(Math.max(saved, 0), CHAPTERS.length - 1);
    applyHashRoute();
    loadChapter(currentIdx, false);
  } catch(e) {
    document.getElementById('initLoading').innerHTML = AB.errorHTML('加载失败: ' + (e && e.message || e), 'retryLoadBtn');
    var retryBtn = document.getElementById('retryLoadBtn');
    if (retryBtn) retryBtn.addEventListener('click', function() {
      document.getElementById('initLoading').innerHTML = '<div class="skeleton sk-title"></div><div class="skeleton sk-line" style="width:97%"></div><div class="skeleton sk-line" style="width:92%"></div><div class="skeleton sk-line" style="width:96%"></div>';
      loadData();
    });
  }
}

// ===== 目录 (带搜索) =====
function buildTOC(keyword) {
  const toc = document.getElementById('toc');
  toc.innerHTML = '';
  const kw = String(keyword || '').trim().toLowerCase();
  const frag = document.createDocumentFragment();
  let count = 0;
  CHAPTERS.forEach((ch, i) => {
    if (kw && !(ch.title || '').toLowerCase().includes(kw)) return;
    count++;
    const a = document.createElement('a');
    a.href = 'javascript:void(0)';
    a.dataset.idx = i;
    /* 目录入场 stagger：仅完整列表启用；搜索过滤时直出 */
    if (!kw) { a.style.animationDelay = Math.min(count - 1, 24) * 14 + 'ms'; } else { a.style.animation = 'none'; }
    a.setAttribute('role', 'button');
    if (i === currentIdx) a.setAttribute('aria-current', 'true');
    const span = document.createElement('span');
    span.textContent = ch.title;
    const dur = document.createElement('span');
    dur.className = 'ch-dur';
    dur.textContent = fmtTime(ch.dur);
    a.appendChild(span);
    a.appendChild(dur);
    a.addEventListener('click', (e) => {
      e.preventDefault();
      loadChapter(i, isPlaying);
      closeSidebar();
    });
    a.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); a.click(); }
    });
    frag.appendChild(a);
  });
  toc.appendChild(frag);
  if (!count) { toc.innerHTML = AB.emptyHTML('没有找到匹配章节', '清除搜索', 'clearSearchBtn'); var cb = document.getElementById('clearSearchBtn'); if (cb) cb.addEventListener('click', function() { document.getElementById('tocSearch').value = ''; buildTOC(''); }); }
  updateTOCActive();
}

function updateTOCActive() {
  document.querySelectorAll('.sidebar a').forEach((a) => {
    const active = Number(a.dataset.idx) === currentIdx;
    a.classList.toggle('active', active);
    if (active) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
  });
}

document.getElementById('tocSearch').addEventListener('input', (e) => {
  buildTOC(e.target.value);
});

// ===== 侧边栏 =====
function openSidebar() {
  sidebar.classList.add('open');
  overlay.classList.add('show');
  overlay.setAttribute('aria-hidden', 'false');
  menuBtn.setAttribute('aria-expanded', 'true');
  AB.trapFocus(sidebar, menuBtn);
}
function closeSidebar() {
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
  overlay.setAttribute('aria-hidden', 'true');
  menuBtn.setAttribute('aria-expanded', 'false');
  AB.releaseFocus();
}

// ===== 章节渲染 =====
function loadChapter(idx, autoplay) {
  if (idx < 0 || idx >= CHAPTERS.length) return;
  currentIdx = idx;
  const ch = CHAPTERS[idx];
  const reader = document.getElementById('reader');

  // 使用 crossFade 过渡（首次加载直接渲染）
  const doRender = function () {
    reader.innerHTML = '';
    const titleEl = document.createElement('div');
    titleEl.className = 'chapter-title';
    titleEl.textContent = ch.title;
    reader.appendChild(titleEl);

    const contentEl = document.createElement('div');
    contentEl.className = 'chapter-content';
    segElements = [];
    const frag = document.createDocumentFragment();
    ch.segs.forEach((seg, si) => {
      const span = document.createElement('span');
      span.className = 'seg';
      span.dataset.idx = si;
      span.tabIndex = 0;
      span.setAttribute('role', 'button');
      span.textContent = seg.t;
      span.addEventListener('click', () => {
        if (audio.duration) {
          audio.currentTime = seg.s + 0.01;
          if (!isPlaying) { audio.play().catch(() => {}); }
          highlightSeg(si);
          span.classList.remove('flash');
          // 使用 animationend 清 class，避免强制重排
          span.addEventListener('animationend', function onEnd() { span.classList.remove('flash'); span.removeEventListener('animationend', onEnd); });
          span.classList.add('flash');
        }
      });
      span.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); span.click(); }
      });
      frag.appendChild(span);
      segElements.push(span);
    });
    contentEl.appendChild(frag);
    reader.appendChild(contentEl);
    userScrolling = false;
    clearTimeout(scrollResumeTimer);
    reader.scrollTop = 0;
    lastActiveSegIdx = -1;
    highlightSeg(0);
  };

  if (isFirstRender) { isFirstRender = false; doRender(); }
  else { AB.crossFade(reader, doRender); }

  // 更新播放器
  playerTitle.textContent = ch.title;
  audio.src = ch.file;
  playBtn.disabled = false;
  prevBtn.disabled = (idx === 0);
  nextBtn.disabled = (idx === CHAPTERS.length - 1);

  // 更新顶部进度条（带动画）
  topProgress.style.width = '0';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const bookProgress = ((idx + 1) / CHAPTERS.length * 100).toFixed(1);
    topProgress.style.width = bookProgress + '%';
  }));

  // 保存进度
  safeSetStorage('zhixiao_chapter', idx);

  // 更新目录高亮
  updateTOCActive();

  updateMediaSession();
  updateHash();

  // 屏幕阅读器播报
  announce && announce('已加载第 ' + (idx + 1) + ' 章：' + ch.title);

  // 自动播放：等待音频就绪后再 play()，避免移动浏览器（iOS Safari / Chrome Android）
  // 在 src 改变后立即 play() 时因未加载完抛 NotAllowedError 被 catch 静默吞掉，
  // 导致章节末尾跳转后听不见声音。
  if (autoplay) tryPlayAfterReady();
}

/* 在 canplay / loadeddata 时再尝试播放；带过期保护避免事件链断裂。
 * 仅在自动连播时使用，避免打断用户手动暂停的意图。 */
function tryPlayAfterReady() {
  const a = audio;
  let done = false;
  const tryOnce = () => {
    if (done) return;
    done = true;
    a.removeEventListener('canplay', tryOnce);
    a.removeEventListener('loadeddata', tryOnce);
    a.play().catch(() => {
      /* 兜底：play() 被拒绝时（极少数浏览器的 autoplay 策略），提示用户手动点击 */
      showToast && showToast('请点击播放按钮继续收听');
    });
  };
  a.addEventListener('canplay', tryOnce);
  a.addEventListener('loadeddata', tryOnce);
  /* 兜底：若 canplay 始终未触发（SW 已缓存完整文件时可能不触发 loadeddata），
   * 最多等 1.2s 直接播放，避免用户感知"卡顿"或"跳章后无声"。 */
  setTimeout(() => { if (!done) tryOnce(); }, 1200);
}

// 进度条拖拽
let isDragging = false;
function seekFromEvent(e) {
  const rect = progressTrack.getBoundingClientRect();
  const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
  const ratio = Math.max(0, Math.min(1, x / rect.width));
  if (audio.duration) {
    audio.currentTime = ratio * audio.duration;
    progressFill.style.width = (ratio * 100) + '%';
    progressThumb.style.left = (ratio * 100) + '%';
  }
}
progressTrack.addEventListener('mousedown', (e) => { isDragging = true; progressTrack.classList.add('is-dragging'); seekFromEvent(e); });
document.addEventListener('mousemove', (e) => { if (isDragging) seekFromEvent(e); });
document.addEventListener('mouseup', () => { isDragging = false; progressTrack.classList.remove('is-dragging'); });
progressTrack.addEventListener('touchstart', (e) => { isDragging = true; progressTrack.classList.add('is-dragging'); seekFromEvent(e); }, { passive: true });
progressTrack.addEventListener('touchmove', (e) => { if (isDragging) seekFromEvent(e); }, { passive: true });
progressTrack.addEventListener('touchend', () => { isDragging = false; progressTrack.classList.remove('is-dragging'); });

// 进度条悬停气泡
function showTooltip(e) {
  const rect = progressTrack.getBoundingClientRect();
  const dur = audio.duration;
  if (!dur) { progressTooltip.classList.remove('show'); return; }
  const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
  const ratio = Math.max(0, Math.min(1, x / rect.width));
  progressTooltip.style.left = (ratio * 100) + '%';
  progressTooltip.textContent = fmtTime(ratio * dur) + ' / ' + fmtTime(dur);
  progressTooltip.classList.add('show');
}
progressTrack.addEventListener('mousemove', showTooltip);
progressTrack.addEventListener('mouseleave', () => progressTooltip.classList.remove('show'));

// 键盘控制进度条
progressTrack.addEventListener('keydown', (e) => {
  if (!audio.duration) return;
  const delta = e.shiftKey ? 30 : 5;
  if (e.key === 'ArrowLeft') { e.preventDefault(); audio.currentTime = Math.max(0, audio.currentTime - delta); }
  if (e.key === 'ArrowRight') { e.preventDefault(); audio.currentTime = Math.min(audio.duration, audio.currentTime + delta); }
});

// 高亮段（仅更新变化的节点，避免每帧遍历整章，减少重绘/回流）
function highlightSeg(idx) {
  if (idx < 0 || idx >= segElements.length) return;
  if (idx === lastActiveSegIdx) return;
  const prev = segElements[lastActiveSegIdx];
  if (prev) { prev.classList.remove('active'); prev.removeAttribute('aria-current'); }
  const node = segElements[idx];
  node.classList.add('active');
  node.setAttribute('aria-current', 'true');
  lastActiveSegIdx = idx;
  // 播放中自动滚动跟随；用户手动滚动时暂停跟随
  if (!userScrolling) {
    const readerEl = document.getElementById('reader');
    const rect = node.getBoundingClientRect();
    const containerRect = readerEl.getBoundingClientRect();
    if (rect.top < containerRect.top + 80 || rect.bottom > containerRect.bottom - 80) {
      node.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}

  let cachedCount = 0;
  let prefetchRun = 0;
  /* 数据未加载完成时，预缓存会被延迟到 loadChapter 后 */
  let dataReady = CHAPTERS.length > 0;

  /* 获取所有音频 URL（同源，相对路径基于当前位置） */
  function getAllAudioUrls() {
    return CHAPTERS.map((ch) => {
      const base = location.href.replace(/[^/]*$/, '');
      return new URL(ch.file, base).href;
    });
  }

  /* 统计已缓存的章节数（仅匹配 chapters/ch*.mp3，忽略外壳资源） */
  async function queryCachedCount() {
    try {
      const cache = await caches.open(CACHE_NAME);
      const keys = await cache.keys();
      const audioUrls = new Set(getAllAudioUrls());
      let n = 0;
      keys.forEach((r) => { if (audioUrls.has(r.url)) n++; });
      return n;
    } catch (_) { return 0; }
  }

  /* 同步刷新 UI */
  async function updateCacheUI() {
    if (!cacheToggle) return;
    const total = CHAPTERS.length;
    if (total > 0) cachedCount = await queryCachedCount();
    const pct = total > 0 ? (cachedCount / total * 100) : 0;
    if (cacheProgressBar) cacheProgressBar.style.width = pct.toFixed(1) + '%';
    if (cacheCountText) cacheCountText.textContent = cachedCount + ' / ' + total + ' 章';
    if (cacheBadge) {
      cacheBadge.textContent = cachedCount;
      cacheBadge.hidden = cachedCount === 0;
    }

    const online = navigator.onLine;
    if (cacheStatusText) {
      cacheStatusText.textContent = online ? '在线' : '离线';
      cacheStatusText.className = 'cache-status ' + (online ? 'online' : 'offline');
    }

    if (total > 0 && cachedCount >= total) {
      if (cacheHint) cacheHint.textContent = '全部章节已缓存，断网也能听';
      if (cacheStartBtn) { cacheStartBtn.disabled = true; cacheStartBtn.textContent = '已完成'; }
    } else if (!online) {
      if (cacheHint) cacheHint.textContent = '当前离线，连接网络后可继续缓存';
      if (cacheStartBtn) cacheStartBtn.disabled = true;
    } else {
      if (cacheHint) cacheHint.textContent = '有网络时自动缓存后续章节，断网也能听';
      if (cacheStartBtn) { cacheStartBtn.disabled = false; cacheStartBtn.textContent = autoCacheEnabled ? '继续缓存' : '开始缓存'; }
    }

    if (cacheStopBtn) cacheStopBtn.hidden = !prefetching;
    if (cacheStartBtn) cacheStartBtn.hidden = prefetching || (total > 0 && cachedCount >= total);
    if (cacheToggle) cacheToggle.classList.toggle('active', prefetching);
    if (cacheIcon) cacheIcon.textContent = prefetching ? '⟳' : '⬇';
  }

  /* 开始预缓存：当前章节之后优先，走到末尾后再从头补齐，确保最终覆盖全书 */
  async function startPrefetch() {
    if (prefetching) return;
    if (!dataReady || CHAPTERS.length === 0) return;
    if (!navigator.onLine) { updateCacheUI(); return; }
    if (cachedCount >= CHAPTERS.length) { updateCacheUI(); return; }

    prefetching = true;
    const runId = ++prefetchRun;
    abortController = new AbortController();
    updateCacheUI();

    const allUrls = getAllAudioUrls();
    const ordered = [...allUrls.slice(currentIdx), ...allUrls.slice(0, currentIdx)];

    try {
      const cache = await caches.open(CACHE_NAME);
      for (const url of ordered) {
        if (!prefetching || runId !== prefetchRun) break;
        if (!navigator.onLine) break;
        const hit = await cache.match(url);
        if (hit) continue;
        try {
          const resp = await fetch(url, { signal: abortController.signal, mode: 'cors', cache: 'no-cache' });
          if (resp && resp.ok) {
            await cache.put(url, resp.clone());
            cachedCount++;
            const pct = (cachedCount / allUrls.length * 100);
            if (cacheProgressBar) cacheProgressBar.style.width = pct.toFixed(1) + '%';
            if (cacheCountText) cacheCountText.textContent = cachedCount + ' / ' + allUrls.length + ' 章';
            if (cacheBadge) { cacheBadge.textContent = cachedCount; cacheBadge.hidden = false; }
          }
        } catch (e) {
          if (e && e.name === 'AbortError') break;
          if (!navigator.onLine) break;
        }
        /* 给移动端网络栈与浏览器渲染留出调度间隔，避免并发下载拖垮播放 */
        await new Promise((resolve) => setTimeout(resolve, 120));
      }
    } catch (_) {}

    prefetching = false;
    abortController = null;
    await updateCacheUI();
    if (cachedCount >= allUrls.length) showToast && showToast('全部章节已缓存');
  }

  /* 暂停：用户主动停止，并持久化状态 */
  function stopPrefetch() {
    autoCacheEnabled = false;
    try { localStorage.setItem('zhixiao_auto_cache', 'false'); } catch (_) {}
    ++prefetchRun;
    if (abortController) abortController.abort();
    prefetching = false;
    updateCacheUI();
    showToast && showToast('已暂停自动缓存，可随时继续');
  }

  /* 启用：用户主动开启，并持久化状态 */
  function startManual() {
    autoCacheEnabled = true;
    try { localStorage.setItem('zhixiao_auto_cache', 'true'); } catch (_) {}
    startPrefetch();
  }

  /* 清除全部缓存（仅删音频 cache，外壳不受影响） */
  async function clearCache() {
    try { await caches.delete(CACHE_NAME); } catch (_) {}
    cachedCount = 0;
    await updateCacheUI();
    showToast && showToast('已清除缓存');
  }

  /* 事件绑定 */
  if (cacheToggle) {
    cacheToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      cachePopup.classList.toggle('open');
      cacheToggle.setAttribute('aria-expanded', String(cachePopup.classList.contains('open')));
    });
  }
  if (cacheStartBtn) cacheStartBtn.addEventListener('click', startManual);
  if (cacheStopBtn) cacheStopBtn.addEventListener('click', stopPrefetch);
  if (cacheClearBtn) cacheClearBtn.addEventListener('click', clearCache);

  document.addEventListener('click', (e) => {
    if (cachePopup && cachePopup.classList.contains('open') && !e.target.closest('.cache-panel')) {
      cachePopup.classList.remove('open');
      if (cacheToggle) cacheToggle.setAttribute('aria-expanded', 'false');
    }
  });

  /* 网络状态变化时更新 UI；重新联网后自动从断点继续 */
  window.addEventListener('online', () => { updateCacheUI(); if (autoCacheEnabled) window.setTimeout(startPrefetch, 300); });
  window.addEventListener('offline', () => { updateCacheUI(); });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && navigator.onLine && autoCacheEnabled && !prefetching && dataReady) startPrefetch();
  });

  /* 监听 SW 消息：若被其他客户端触发缓存完成，同步刷新 UI */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', (e) => {
      if (e.data && (e.data.type === 'PREFETCH_DONE' || e.data.type === 'CACHED_AUDIO_LIST')) updateCacheUI();
    });
  }

  /* 申请持久化存储，避免移动端浏览器在空间紧张时优先清理音频缓存 */
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  /* 暴露给 loadData 调用：数据加载完成后启动持续缓存 */
  window.__zhixiaoStartCache = function () {
    dataReady = true;
    updateCacheUI();
    if (navigator.onLine && autoCacheEnabled) window.setTimeout(startPrefetch, 800);
  };
})();

// 数据加载完成后启动持续缓存（loadData 内部已成功才调用）
const origLoadData = loadData;
loadData = async function () {
  await origLoadData.apply(this, arguments);
  if (CHAPTERS.length > 0) window.__zhixiaoStartCache && window.__zhixiaoStartCache();
};

// 初始化
initTheme();
loadData();
</script>

<script>
/* 交互动效增强：播放/暂停键弹跳反馈（附加监听，不影响主逻辑） */
(function () {
  'use strict';
  var audioEl = document.getElementById('audio');
  var pBtn = document.getElementById('playBtn');
  if (!audioEl || !pBtn) return;
  function pop() {
    pBtn.classList.remove('is-pop');
    pBtn.addEventListener('animationend', function onEnd() { pBtn.classList.remove('is-pop'); pBtn.removeEventListener('animationend', onEnd); });
    requestAnimationFrame(function() { pBtn.classList.add('is-pop'); });
  }
  audioEl.addEventListener('play', pop);
  audioEl.addEventListener('pause', pop);
})();
</script>
</body>
</html>
