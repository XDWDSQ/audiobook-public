<style>
:root{
    --bg:#efe2cc;--bg-deep:#e3d2b6;--panel:rgba(255,250,240,0.94);--ink:#2f2923;--muted:#8b7d70;--line:#d6c3a8;--accent:#b66b3f;--accent-deep:#8f4f2c;--accent-soft:#f3dfcf;--gold:#c7954f;--shadow:0 20px 60px rgba(85,58,35,0.18);--shadow-soft:0 10px 30px rgba(85,58,35,0.12);--radius:22px;--font-serif:"Noto Serif SC","Source Han Serif SC","Songti SC",SimSun,serif;--font-sans:"PingFang SC","Microsoft YaHei",sans-serif
}
html.dark{
    color-scheme:dark;--bg:#1a1715;--bg-deep:#252220;--panel:rgba(37,34,32,0.92);--ink:#e8e0d4;--muted:#9a9088;--line:#3a3530;--accent:#c9974a;--accent-deep:#dbb06a;--accent-soft:rgba(201,151,74,0.15);--gold:#d8ad68;--shadow:0 20px 60px rgba(0,0,0,0.30);--shadow-soft:0 10px 30px rgba(0,0,0,0.22)
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
    min-height:100vh;margin:0;
    background:
        radial-gradient(1200px 600px at 15% -10%,rgba(199,149,79,0.22),transparent 70%),
        radial-gradient(900px 700px at 110% 30%,rgba(182,107,63,0.14),transparent 70%),
        var(--bg);
    color:var(--ink);
    font-family:var(--font-sans);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    transition:background 0.4s ease,color 0.4s ease;
    display:flex;
    flex-direction:column;
}
.skip-link{position:absolute;left:-9999px;top:0;z-index:100;padding:10px 18px;background:var(--ink);color:var(--bg);border-radius:0 0 12px 0;text-decoration:none;font-size:14px}
.skip-link:focus{left:0}

.page-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;contain:layout style paint}
.page-bg__glow{position:absolute;inset:0;background:radial-gradient(60% 50% at 15% 0%,rgba(182,107,63,0.10),transparent 70%),radial-gradient(55% 45% at 80% 100%,rgba(182,107,63,0.08),transparent 70%)}
html.dark .page-bg__glow{background:radial-gradient(60% 50% at 15% 0%,rgba(201,151,74,0.10),transparent 70%),radial-gradient(55% 45% at 80% 100%,rgba(201,151,74,0.06),transparent 70%)}

.container{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:36px 28px 56px;flex:1;display:flex;flex-direction:column;contain:layout style}

/* Topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:12px 18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-soft);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand__text{display:inline-flex;flex-direction:column;line-height:1.05}
.brand__title{font-family:var(--font-serif);font-size:19px;font-weight:700;letter-spacing:0.04em}
.brand__sub{font-size:10px;letter-spacing:0.32em;color:var(--muted);margin-top:2px}
.theme-toggle{width:32px;height:32px;border:0;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);transition:color 0.2s,transform 0.3s ease;position:relative}
.theme-toggle:hover{color:var(--accent)}
.theme-toggle__sun,.theme-toggle__moon{position:absolute;transition:opacity .35s ease,transform .5s cubic-bezier(.22,.61,.36,1)}
.theme-toggle__moon{display:inline-block;opacity:0;transform:rotate(-100deg) scale(.4)}
html.dark .theme-toggle__sun{display:inline-block;opacity:0;transform:rotate(100deg) scale(.4)}
html.dark .theme-toggle__moon{opacity:1;transform:none;color:var(--gold)}

/* 404 Main */
.error-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 0 32px}

/* SVG 插画：飘落的书页 */
.error-illustration{position:relative;width:220px;height:180px;margin-bottom:36px}
.error-illustration svg{width:100%;height:100%;display:block}
@keyframes floatPage{
    0%,100%{transform:translateY(0) rotate(-2deg)}
    50%{transform:translateY(-10px) rotate(2deg)}
}
@keyframes floatPage2{
    0%,100%{transform:translateY(0) rotate(3deg)}
    50%{transform:translateY(-8px) rotate(-3deg)}
}
.error-illustration .page-1{animation:floatPage 4s ease-in-out infinite;transform-origin:center}
.error-illustration .page-2{animation:floatPage2 5s ease-in-out infinite .6s;transform-origin:center}
.error-illustration .page-3{animation:floatPage 4.5s ease-in-out infinite 1.2s;transform-origin:center}

.error-code{
    font-family:var(--font-serif);
    font-size:clamp(72px,14vw,120px);
    font-weight:700;
    letter-spacing:0.08em;
    line-height:1;
    margin:0 0 12px;
    background:linear-gradient(135deg,var(--accent),var(--gold));
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    opacity:0;
    transform:translateY(20px);
    animation:fadeInUp .8s cubic-bezier(.22,.61,.36,1) .1s forwards
}
.error-title{
    font-family:var(--font-serif);
    font-size:clamp(22px,4vw,32px);
    font-weight:500;
    letter-spacing:0.08em;
    margin:0 0 14px;
    opacity:0;transform:translateY(20px);
    animation:fadeInUp .8s cubic-bezier(.22,.61,.36,1) .25s forwards
}
.error-desc{
    font-size:15px;line-height:1.9;color:var(--muted);
    max-width:420px;margin:0 auto 32px;
    opacity:0;transform:translateY(20px);
    animation:fadeInUp .8s cubic-bezier(.22,.61,.36,1) .4s forwards
}

.error-actions{
    display:flex;flex-wrap:wrap;gap:12px;justify-content:center;
    opacity:0;transform:translateY(20px);
    animation:fadeInUp .8s cubic-bezier(.22,.61,.36,1) .55s forwards
}
.error-btn{
    display:inline-flex;align-items:center;gap:10px;
    padding:13px 28px;border-radius:999px;
    text-decoration:none;font-size:14px;letter-spacing:0.08em;
    transition:all .3s ease;cursor:pointer
}
.error-btn--primary{
    background:var(--accent);color:#fff;border:1px solid var(--accent);
    box-shadow:0 8px 24px -10px rgba(182,107,63,0.55)
}
.error-btn--primary:hover{background:var(--accent-deep);border-color:var(--accent-deep);transform:translateY(-2px);box-shadow:0 12px 32px -10px rgba(182,107,63,0.65)}
.error-btn--secondary{
    background:transparent;color:var(--ink);border:1px solid var(--line)
}
.error-btn--secondary:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.error-btn:active{transform:translateY(0) scale(.98);transition:transform .12s ease}
.error-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 书籍快捷入口 */
.error-books{
    margin-top:44px;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;
    width:100%;max-width:640px;
    opacity:0;transform:translateY(20px);
    animation:fadeInUp .8s cubic-bezier(.22,.61,.36,1) .7s forwards
}
.error-book{
    display:flex;flex-direction:column;gap:8px;
    padding:20px;border-radius:16px;
    background:var(--panel);border:1px solid var(--line);
    text-decoration:none;color:var(--ink);
    transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease;
    box-shadow:var(--shadow-soft)
}
.error-book:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.error-book__badge{
    font-size:10px;letter-spacing:0.28em;color:var(--accent);font-weight:600
}
.error-book__title{
    font-family:var(--font-serif);font-size:20px;font-weight:500;letter-spacing:0.1em;margin:0
}
.error-book__meta{font-size:12px;color:var(--muted);margin:0}

@keyframes fadeInUp{
    from{opacity:0;transform:translateY(30px)}
    to{opacity:1;transform:translateY(0)}
}

/* Footer */
.footer{margin-top:auto;text-align:center;padding-top:32px}
.footer__line{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin-bottom:20px}
.footer__text{font-family:var(--font-serif);font-size:14px;letter-spacing:0.08em;margin:0 0 6px}
.footer__amp{color:var(--muted);margin:0 2px}
.footer__sub{font-size:10px;letter-spacing:0.32em;color:var(--muted);margin:0}

*:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent);color:var(--bg)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-deep)}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--accent-deep)}

@media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
    .error-code,.error-title,.error-desc,.error-actions,.error-books{opacity:1 !important;transform:none !important}
    .error-illustration .page-1,.error-illustration .page-2,.error-illustration .page-3{animation:none !important}
}

@media (max-width:640px){
    .container{padding:20px 18px 40px}
    .topbar{padding:12px 14px}
    .error-wrap{padding:32px 0 24px}
    .error-illustration{width:180px;height:148px;margin-bottom:28px}
    .error-books{grid-template-columns:1fr;gap:12px;margin-top:32px}
}
@media (max-width:420px){
    .error-btn{padding:12px 22px;font-size:13px}
}
@supports (padding-bottom:env(safe-area-inset-bottom)){
    .container{padding-top:calc(36px + env(safe-area-inset-top));padding-bottom:calc(56px + env(safe-area-inset-bottom))}
    .footer{padding-bottom:env(safe-area-inset-bottom)}
}
@media (hover:none) and (pointer:coarse){
    .error-book:hover{transform:none;box-shadow:var(--shadow-soft)}
    .error-book:active{transform:scale(.98);transition:transform .1s}
    .error-btn--primary:hover{background:var(--accent);transform:none;box-shadow:0 8px 24px -10px rgba(182,107,63,0.55)}
    .error-btn--secondary:hover{border-color:var(--line);color:var(--ink);transform:none}
}
</style>
</head>

<script>
(function () {
    'use strict';
    var root = document.documentElement;

    /* 主题切换 */
    var btn = document.getElementById('themeToggle');
    if (btn) {
        btn.setAttribute('aria-pressed', root.classList.contains('dark') ? 'true' : 'false');
        btn.addEventListener('click', function () {
            try {
                var isDark = root.classList.toggle('dark');
                root.classList.toggle('light', !isDark);
                btn.setAttribute('aria-pressed', isDark ? 'true' : 'false');
                localStorage.setItem('audiobook-theme', isDark ? 'dark' : 'light');
            } catch (e) {}
        });
    }

})();
</script>
